<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginalia API Documentation</title>
<style>
:root {
    --app-bg: #f7f8fa; --panel: #f1f2f4; --surface: #ffffff; --surface-2: #f6f7f8; --surface-3: #e9ebef;
    --text: #24262a; --text-2: #555b65; --text-3: #858b95; --line: #d9dce2; --line-strong: #c7cbd2;
    --accent: #3574f0; --accent-hover: #2f65d2; --selection: rgba(53,116,240,.13); --focus: rgba(53,116,240,.24);
    --green: #168a4b; --green-bg: #e3f4ea; --blue: #296dc5; --blue-bg: #e4effc; --orange: #b96817; --orange-bg: #fff0dc;
    --red: #c13b42; --red-bg: #fbe7e8; --purple: #7754b8; --purple-bg: #eee8fa; --cyan: #16828e;
    --code-bg: #f3f4f6; --shadow: rgba(21,25,33,.18); --radius: 5px; --sidebar-w: 310px; --activity-w: 42px;
    --mono: "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    --motion-fast: 100ms; --motion-base: 180ms; --motion-slow: 260ms;
    --ease-out: cubic-bezier(.2,.75,.25,1); --ease-spring: cubic-bezier(.2,.9,.25,1.15);
}
[data-theme="dark"] {
    --app-bg: #1e1f22; --panel: #2b2d30; --surface: #1e1f22; --surface-2: #25262a; --surface-3: #393b40;
    --text: #dfe1e5; --text-2: #b3b6bd; --text-3: #7d828c; --line: #393b40; --line-strong: #4b4e54;
    --accent: #3574f0; --accent-hover: #467ff2; --selection: rgba(53,116,240,.25); --focus: rgba(53,116,240,.34);
    --green: #62b778; --green-bg: rgba(68,157,89,.18); --blue: #6aa9e9; --blue-bg: rgba(63,126,191,.2); --orange: #d79b62; --orange-bg: rgba(177,113,44,.2);
    --red: #e06c75; --red-bg: rgba(190,67,76,.2); --purple: #b494e7; --purple-bg: rgba(126,88,184,.22); --cyan: #65c4ce;
    --code-bg: #25262a; --shadow: rgba(0,0,0,.42);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--app-bg); color: var(--text); font-size: 13px; line-height: 1.45; letter-spacing: 0; }
button, input, textarea, select { font: inherit; letter-spacing: 0; }
button { cursor: pointer; transition: color var(--motion-fast), background-color var(--motion-fast), border-color var(--motion-fast), box-shadow var(--motion-fast), transform var(--motion-fast) var(--ease-out); }
button:active:not(:disabled) { transform: scale(.965); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
input, textarea, select { color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 6px 8px; outline: none; }
input, textarea, select { transition: color var(--motion-base), background-color var(--motion-base), border-color var(--motion-fast), box-shadow var(--motion-fast); }
input:hover, textarea:hover, select:hover { border-color: var(--text-3); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px color-mix(in srgb, var(--focus) 35%, transparent); }
textarea { resize: vertical; }
svg { display: block; }

.app-shell { display: flex; width: 100%; height: 100%; min-width: 0; }
.activity-bar { width: var(--activity-w); min-width: var(--activity-w); height: 100%; display: flex; flex-direction: column; align-items: center; background: var(--panel); border-right: 1px solid var(--line); z-index: 30; }
.brand-mark { width: 28px; height: 28px; margin: 7px 0 5px; display: grid; place-items: center; border-radius: 6px; color: #fff; background: var(--accent); font-weight: 800; font-size: 14px; user-select: none; transition: transform var(--motion-base) var(--ease-spring), box-shadow var(--motion-base); }
.brand-mark:hover { transform: translateY(-1px) scale(1.04); box-shadow: 0 5px 14px color-mix(in srgb, var(--accent) 30%, transparent); }
.activity-spacer { flex: 1; }
.activity-btn, .icon-btn { display: inline-flex; align-items: center; justify-content: center; border: 0; color: var(--text-2); background: transparent; border-radius: 4px; }
.activity-btn { position: relative; width: 34px; height: 34px; margin: 1px 0; }
.activity-btn:hover, .icon-btn:hover { color: var(--text); background: var(--surface-3); }
.activity-btn:hover svg, .icon-btn:hover svg { transform: scale(1.08); }
.activity-btn.active { color: var(--accent); background: var(--selection); }
.activity-btn.active::before { content: ""; position: absolute; left: -4px; top: 6px; bottom: 6px; width: 2px; background: var(--accent); border-radius: 0 2px 2px 0; animation: activeRail var(--motion-slow) var(--ease-spring); }
.activity-btn svg, .icon-btn svg { width: 17px; height: 17px; stroke-width: 1.8; transition: transform var(--motion-base) var(--ease-spring); }
.activity-bottom { padding-bottom: 7px; }

.sidebar { width: var(--sidebar-w); min-width: 220px; max-width: 460px; height: 100%; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); overflow: hidden; }
.sidebar-header { height: 38px; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.sidebar-header h1 { flex: 1; min-width: 0; font-size: 12px; font-weight: 650; text-transform: uppercase; color: var(--text-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.navigator-count { min-width: 20px; padding: 1px 6px; color: var(--text-3); background: var(--surface-3); border-radius: 8px; text-align: center; font-size: 11px; font-variant-numeric: tabular-nums; transition: transform var(--motion-base) var(--ease-spring), background-color var(--motion-base); }
.navigator-count.bump { animation: countBump var(--motion-slow) var(--ease-spring); }
.mobile-navigator-switch { display: none; align-items: center; gap: 2px; }
.mobile-navigator-switch .icon-btn { width: 25px; height: 25px; }
.mobile-navigator-switch .icon-btn.active { color: var(--accent); background: var(--selection); }
.sidebar-search { position: relative; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.sidebar-search svg { position: absolute; left: 16px; top: 15px; width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
.sidebar-search input { width: 100%; height: 28px; padding: 4px 28px 4px 28px; background: var(--surface-2); border-color: var(--line); }
.sidebar-search:focus-within svg { color: var(--accent); transform: scale(1.08); }
.sidebar-search svg { transition: color var(--motion-fast), transform var(--motion-base) var(--ease-spring); }
.search-clear { position: absolute; right: 12px; top: 10px; width: 23px; height: 23px; opacity: 0; visibility: hidden; transform: scale(.75); pointer-events: none; }
.search-clear.visible { opacity: 1; visibility: visible; transform: scale(1); pointer-events: auto; }
.sidebar-tree { flex: 1; min-height: 0; overflow: auto; padding: 5px 0 8px; }
.sidebar-tree.navigator-enter { animation: navigatorIn var(--motion-base) var(--ease-out); }
.navigator-empty { padding: 28px 18px; color: var(--text-3); text-align: center; font-size: 12px; }
.tree-item { position: relative; display: flex; align-items: center; gap: 5px; height: 26px; padding-right: 8px; color: var(--text-2); cursor: default; user-select: none; white-space: nowrap; transition: color var(--motion-fast), background-color var(--motion-fast), padding-left var(--motion-fast) var(--ease-out); }
.tree-item:hover { background: var(--surface-3); color: var(--text); }
.tree-item.active { background: var(--selection); color: var(--text); }
.tree-item.active::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); transform-origin: center; animation: selectionRail var(--motion-base) var(--ease-spring); }
.tree-item .icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-3); }
.tree-item .icon svg { width: 14px; height: 14px; stroke-width: 1.7; }
.tree-item .arrow { width: 13px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-3); }
.tree-item .arrow::before { content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform var(--motion-base) var(--ease-spring), color var(--motion-fast); }
.tree-item .arrow.open::before { transform: rotate(45deg); }
.tree-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.tree-children { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows var(--motion-base) var(--ease-out), opacity var(--motion-fast); }
.tree-children.open { grid-template-rows: 1fr; opacity: 1; }
.tree-children-inner { min-height: 0; overflow: hidden; }
.method-badge { min-width: 39px; height: 17px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0 5px; border: 1px solid transparent; border-radius: 3px; font: 700 9px/1 var(--mono); transition: transform var(--motion-fast) var(--ease-spring), filter var(--motion-fast), background-color var(--motion-base); }
.tree-item:hover .method-badge { transform: translateX(1px); filter: saturate(1.12); }
.method-GET { color: var(--green); background: var(--green-bg); border-color: color-mix(in srgb, var(--green) 28%, transparent); }
.method-POST { color: var(--blue); background: var(--blue-bg); border-color: color-mix(in srgb, var(--blue) 28%, transparent); }
.method-PUT { color: var(--orange); background: var(--orange-bg); border-color: color-mix(in srgb, var(--orange) 28%, transparent); }
.method-DELETE { color: var(--red); background: var(--red-bg); border-color: color-mix(in srgb, var(--red) 28%, transparent); }
.method-PATCH { color: var(--purple); background: var(--purple-bg); border-color: color-mix(in srgb, var(--purple) 28%, transparent); }
.entity-nav-group { padding: 8px 10px 4px; color: var(--text-3); font-size: 10px; font-weight: 700; text-transform: uppercase; }
.entity-nav-item { height: 34px; padding: 3px 9px 3px 12px; display: grid; grid-template-columns: 17px minmax(0,1fr) auto; grid-template-rows: 16px 12px; column-gap: 6px; color: var(--text-2); cursor: default; transition: color var(--motion-fast), background-color var(--motion-fast), transform var(--motion-fast) var(--ease-out); animation: itemIn var(--motion-base) var(--ease-out) both; animation-delay: min(calc(var(--item-index, 0) * 16ms), 160ms); }
.entity-nav-item:hover { background: var(--surface-3); color: var(--text); }
.entity-nav-item:hover { transform: translateX(2px); }
.entity-nav-item.active { background: var(--selection); }
.entity-nav-icon { grid-column: 1; grid-row: 1 / 3; align-self: center; color: var(--purple); }
.entity-nav-icon svg { width: 14px; height: 14px; }
.entity-nav-name { grid-column: 2; grid-row: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
.entity-nav-package { grid-column: 2; grid-row: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-3); font-size: 10px; font-family: var(--mono); }
.entity-nav-meta { grid-column: 3; grid-row: 1 / 3; align-self: center; color: var(--text-3); font-size: 10px; }
.sidebar-footer { height: 25px; padding: 0 9px; display: flex; align-items: center; gap: 6px; color: var(--text-3); border-top: 1px solid var(--line); font-size: 10px; }
.sidebar-footer .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); transition: background-color var(--motion-base), box-shadow var(--motion-base); }
.sidebar-footer.busy .status-dot { background: var(--accent); animation: statusPulse 1s ease-in-out infinite; }
.resizer { width: 4px; margin-left: -2px; margin-right: -2px; position: relative; z-index: 25; cursor: col-resize; }
.resizer:hover, .resizer.dragging { background: var(--accent); }

.main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; background: var(--surface); overflow: hidden; }
.toolbar { height: 39px; padding: 0 9px; display: flex; align-items: center; gap: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.mobile-sidebar-toggle { display: none; width: 28px; height: 28px; }
.breadcrumb { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; color: var(--text-3); overflow: hidden; white-space: nowrap; }
.breadcrumb .crumb { overflow: hidden; text-overflow: ellipsis; }
.breadcrumb .crumb.current { color: var(--text-2); }
.breadcrumb .separator { color: var(--line-strong); }
.toolbar-actions { display: flex; align-items: center; gap: 3px; }
.toolbar-actions .icon-btn { width: 28px; height: 28px; }
.mode-toggle { position: relative; display: flex; height: 28px; padding: 2px; gap: 1px; background: var(--surface-3); border-radius: 5px; isolation: isolate; }
.mode-toggle::before { content: ""; position: absolute; z-index: -1; left: 2px; top: 2px; width: calc(50% - 2.5px); height: 24px; border-radius: 3px; background: var(--surface); box-shadow: 0 1px 3px var(--shadow); transform: translateX(0); transition: transform var(--motion-slow) var(--ease-spring), background-color var(--motion-base), box-shadow var(--motion-base); }
.mode-toggle[data-mode="debug"]::before { transform: translateX(calc(100% + 1px)); }
.mode-toggle button { position: relative; min-width: 72px; padding: 0 10px; border: 0; border-radius: 3px; color: var(--text-2); background: transparent; font-size: 12px; }
.mode-toggle button:hover { color: var(--text); }
.mode-toggle button.active { color: var(--text); background: transparent; box-shadow: none; }
.mode-toggle button:disabled { opacity: .42; cursor: default; }
.editor-tabs { height: 34px; display: flex; align-items: flex-end; background: var(--panel); border-bottom: 1px solid var(--line); }
.editor-tab { position: relative; min-width: 180px; max-width: 460px; height: 33px; padding: 0 12px; display: flex; align-items: center; gap: 7px; background: var(--surface); border-right: 1px solid var(--line); }
.editor-tab::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--accent); transform-origin: left; animation: tabLineIn var(--motion-slow) var(--ease-out); }
.editor-tab.title-change .title, .editor-tab.title-change .tab-kind { animation: titleSwap var(--motion-base) var(--ease-out); }
.tab-kind { width: 16px; color: var(--blue); display: inline-flex; align-items: center; justify-content: center; }
.tab-kind svg { width: 14px; height: 14px; }
.toolbar .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 550; }
.workspace-body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.content { width: 100%; height: 100%; overflow: auto; background: var(--surface); }
.content.content-enter { animation: workspaceIn var(--motion-slow) var(--ease-out); }
.statusbar { height: 23px; padding: 0 9px; display: flex; align-items: center; gap: 12px; color: var(--text-3); background: var(--panel); border-top: 1px solid var(--line); font-size: 10px; }
.statusbar .spacer { flex: 1; }
.statusbar strong { color: var(--text-2); font-weight: 550; }

.doc-view { width: min(1120px, 100%); margin: 0 auto; padding: 22px 30px 48px; }
.doc-endpoint-header { animation: sectionIn var(--motion-slow) var(--ease-out) both; }
.doc-section { animation: sectionIn var(--motion-slow) var(--ease-out) both; animation-delay: 35ms; }
.doc-section:nth-of-type(3) { animation-delay: 65ms; }
.doc-section:nth-of-type(4) { animation-delay: 95ms; }
.doc-section:nth-of-type(n+5) { animation-delay: 120ms; }
.doc-endpoint-header { padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.doc-endpoint-header .path-line { min-height: 30px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.doc-endpoint-header .method-badge-lg { min-width: 60px; height: 24px; display: inline-flex; align-items: center; justify-content: center; padding: 0 9px; border: 1px solid currentColor; border-radius: 4px; font: 750 11px/1 var(--mono); }
.doc-endpoint-header .path-text { min-width: 0; font: 600 14px/1.4 var(--mono); color: var(--text); word-break: break-all; }
.doc-endpoint-header .name { font-size: 21px; font-weight: 650; line-height: 1.3; margin-bottom: 4px; }
.doc-endpoint-header .desc { max-width: 820px; color: var(--text-2); line-height: 1.6; }
.endpoint-actions { margin-left: auto; display: flex; gap: 4px; }
.btn-primary, .btn-secondary, .action-btn { height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border-radius: 4px; font-size: 12px; }
.btn-primary { border: 1px solid var(--accent); color: #fff; background: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary, .action-btn { border: 1px solid var(--line-strong); color: var(--text-2); background: var(--surface); }
.btn-secondary:hover, .action-btn:hover { color: var(--text); background: var(--surface-2); }
.action-btn svg { width: 14px; height: 14px; }
.doc-section { margin-bottom: 24px; }
.doc-section h3 { height: 28px; display: flex; align-items: center; margin-bottom: 5px; color: var(--text-2); font-size: 12px; font-weight: 650; text-transform: none; }
.doc-table { width: 100%; border-collapse: collapse; table-layout: auto; border-top: 1px solid var(--line); }
.doc-table th { padding: 6px 9px; text-align: left; color: var(--text-3); background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 10px; font-weight: 650; white-space: nowrap; }
.doc-table td { padding: 7px 9px; color: var(--text-2); border-bottom: 1px solid var(--line); vertical-align: top; }
.doc-table tbody tr td { transition: background-color var(--motion-fast); }
.doc-table tbody tr:hover td { background: color-mix(in srgb, var(--selection) 52%, transparent); }
.doc-table .param-name { color: var(--blue); font: 600 12px/1.5 var(--mono); }
.doc-table .param-type { color: var(--purple); font: 500 11px/1.5 var(--mono); }
.required { color: var(--red); font-size: 10px; font-weight: 650; }
.optional { color: var(--text-3); font-size: 10px; }
.code-block { position: relative; max-height: 420px; padding: 12px 14px; overflow: auto; color: var(--text-2); background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; }
.copy-btn { position: sticky; float: right; top: 0; height: 24px; padding: 0 8px; color: var(--text-3); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; font-size: 10px; }
.copy-btn:hover { color: var(--text); background: var(--surface-3); }
.entity-link { color: var(--blue); cursor: pointer; text-decoration: none; }
.entity-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.tag, .badge-sse, .badge-deprecated { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; margin-right: 4px; border-radius: 3px; font-size: 10px; }
.tag { color: var(--text-2); background: var(--surface-3); }
.badge-sse { color: var(--orange); background: var(--orange-bg); }
.badge-deprecated { color: var(--red); background: var(--red-bg); }
.empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-3); }
.empty-state-mark { width: 54px; height: 54px; margin-bottom: 14px; display: grid; place-items: center; color: var(--accent); background: var(--selection); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 8px; animation: emptyMarkIn 420ms var(--ease-spring) both; }
.empty-state-mark svg { width: 27px; height: 27px; }
.empty-state h2 { color: var(--text-2); font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.empty-state p { font-size: 11px; }

.debug-view { height: 100%; display: grid; grid-template-rows: auto auto minmax(150px, .85fr) minmax(180px, 1.15fr); overflow: hidden; background: var(--surface); animation: debugIn var(--motion-slow) var(--ease-out); }
.debug-request { padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.debug-url-bar { display: flex; gap: 6px; }
.debug-url-bar select { width: 92px; height: 30px; font: 700 11px var(--mono); }
.debug-url-bar input { flex: 1; min-width: 120px; height: 30px; font-family: var(--mono); }
.debug-url-bar button { height: 30px; padding: 0 15px; border: 1px solid var(--accent); border-radius: 4px; color: #fff; background: var(--accent); font-weight: 600; }
.debug-url-bar button:hover { background: var(--accent-hover); box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 22%, transparent); transform: translateY(-1px); }
.debug-url-bar button.is-loading { color: transparent; pointer-events: none; position: relative; }
.debug-url-bar button.is-loading::after { content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; animation: spin .65s linear infinite; }
.debug-url-bar button.sse-btn { color: var(--orange); background: var(--orange-bg); border-color: var(--orange); }
.debug-tabs { display: flex; align-items: flex-end; height: 32px; padding-left: 8px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.debug-tabs button { position: relative; height: 32px; padding: 0 12px; color: var(--text-3); background: transparent; border: 0; font-size: 11px; }
.debug-tabs button::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--accent); transform: scaleX(0); transition: transform var(--motion-base) var(--ease-spring); }
.debug-tabs button:hover { color: var(--text-2); }
.debug-tabs button.active { color: var(--text); }
.debug-tabs button.active::after { transform: scaleX(1); }
.debug-tab-content { min-height: 0; overflow: auto; padding: 9px 12px; }
.debug-tab-content.tab-enter { animation: debugTabIn var(--motion-base) var(--ease-out); }
.kv-table { width: 100%; border-collapse: collapse; }
.kv-table th { padding: 4px 5px; text-align: left; color: var(--text-3); font-size: 10px; font-weight: 550; }
.kv-table td { padding: 3px 5px; }
.kv-table tbody tr { animation: rowIn var(--motion-base) var(--ease-out); transition: opacity var(--motion-fast), transform var(--motion-fast) var(--ease-out); }

<div class="modal-overlay" id="editModal">

            <input id="commandInput" placeholder="Search endpoints, paths, controllers, and entities" autocomplete="off">
            <kbd>esc</kbd>
        </div>
