<div class="toast" id="toast"></div>

<script>
const PREFIX = location.pathname.replace(/\/+$/, '');
const API = PREFIX + '/api';
let currentMode = 'doc';
let currentApi = null;
let currentEntity = null;
let currentControllerClass = null;
let treeData = [];
let allApis = [];
let allEntities = [];
let sseSource = null;
let openTreeKeys = new Set();
let applyingUrlState = false;
let currentNavigator = 'apis';
let commandItems = [];
let commandIndex = 0;
let toastTimer = null;

// ==================== Init ====================
async function init() {
    setAppStatus('Indexing source metadata...');
    initSidebarResize();
    await Promise.all([loadTree(), loadAllApis(), loadAllEntities()]);
    applyUrlState();
    updateStats();
    updateWorkspaceChrome();
    setAppStatus('Source index ready');
}

async function loadTree() {
    try {
        const res = await fetch(API + '/tree');
        if (res.ok) treeData = await res.json();
    } catch (e) { console.error('Failed to load tree', e); }
    if (currentNavigator === 'apis') {
        renderTree(treeData);
        restoreTreeSelection();
    }
}

async function loadAllApis() {
    try {
        const res = await fetch(API + '/endpoints');
        if (res.ok) allApis = await res.json();
    } catch (e) { console.error('Failed to load APIs', e); }
    updateStats();
}

async function loadAllEntities() {
    try {
        const res = await fetch(API + '/entities');
        if (res.ok) allEntities = await res.json();
    } catch (e) { console.error('Failed to load entities', e); }
    if (currentNavigator === 'entities') renderEntityNavigator(document.getElementById('searchInput').value);
    updateStats();
}

function iconSvg(name) {
    const paths = {
        folder: '<path d="M3 6h7l2 2h9v11H3z"/><path d="M3 10h18"/>',
        controller: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/>',
        entity: '<path d="M7 3h10l4 4v10l-4 4H7l-4-4V7z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
        enum: '<path d="M5 5h14v14H5z"/><path d="M9 9h6M9 13h6"/>',
        file: '<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>',
        moon: '<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/>'
    };
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor">${paths[name] || paths.file}</svg>`;
}

function replayAnimation(element, className) {
    if (!element || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    element.classList.remove(className);
    void element.offsetWidth;
    element.classList.add(className);
    element.addEventListener('animationend', () => element.classList.remove(className), { once: true });
}

// ==================== Tree ====================
function renderTree(data) {
    const container = document.getElementById('treeContainer');
    container.innerHTML = '';
    if (!data.length) {
        container.innerHTML = '<div class="navigator-empty">No endpoints found</div>';
        return;
    }
    data.forEach(node => container.appendChild(createTreeNode(node, 0, '')));
}

function createTreeNode(node, depth, parentKey) {
    const nodeKey = getTreeNodeKey(node, parentKey);
    const wrapper = document.createElement('div');
    const item = document.createElement('div');
    item.className = 'tree-item';
    item.style.paddingLeft = (12 + depth * 16) + 'px';
    item.dataset.treeKey = nodeKey;
    item.dataset.nodeType = node.type || '';
    if (node.id) item.dataset.nodeId = node.id;

    const hasChildren = node.children && node.children.length > 0;
    const childrenDiv = hasChildren ? document.createElement('div') : null;
    if (childrenDiv) {
        childrenDiv.className = 'tree-children';
        const childrenInner = document.createElement('div');
        childrenInner.className = 'tree-children-inner';
        node.children.forEach(child => childrenInner.appendChild(createTreeNode(child, depth + 1, nodeKey)));
        childrenDiv.appendChild(childrenInner);
    }

    // Arrow: visible for items with children, hidden spacer for leaf nodes
    if (hasChildren) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        if (openTreeKeys.has(nodeKey)) arrow.classList.add('open');
        item.appendChild(arrow);
    } else {
        const spacer = document.createElement('span');
        spacer.className = 'arrow';
        spacer.style.visibility = 'hidden';
        item.appendChild(spacer);
    }

    // Icon or method badge
    if (node.type === 'api' && node.icon) {
        const method = normalizeHttpMethod(node.icon);
        const badge = document.createElement('span');
        badge.className = 'method-badge method-' + method;
        badge.textContent = method;
        item.appendChild(badge);
    } else if (node.type === 'directory' || node.type === 'controller') {
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.innerHTML = iconSvg(node.type === 'directory' ? 'folder' : 'controller');
        item.appendChild(icon);
    }

    const label = document.createElement('span');
    label.className = 'tree-label';
    label.textContent = node.name;
    label.title = node.name;
    item.appendChild(label);

    // Click anywhere on the item to toggle/select
    item.onclick = () => {
        if (node.type === 'api') {
            selectApi(node.id);
        } else if (node.type === 'controller') {
            if (childrenDiv) {
                toggleTreeNode(nodeKey, item, childrenDiv);
            }
            selectController(node.id);
        } else if (node.type === 'directory' && childrenDiv) {
            toggleTreeNode(nodeKey, item, childrenDiv);
        }
    };

    wrapper.appendChild(item);
    if (childrenDiv) {
        if (openTreeKeys.has(nodeKey)) childrenDiv.classList.add('open');
        wrapper.appendChild(childrenDiv);
    }

    return wrapper;
}

function getTreeNodeKey(node, parentKey) {
    const rawId = node.id || node.name || 'node';
    const segment = (node.type || 'node') + ':' + rawId;
    return parentKey ? parentKey + '/' + segment : segment;
}

function toggleTreeNode(nodeKey, item, childrenDiv) {
    const arrow = item.querySelector('.arrow');
    const willOpen = !childrenDiv.classList.contains('open');
    if (arrow) arrow.classList.toggle('open', willOpen);
    childrenDiv.classList.toggle('open', willOpen);
    if (willOpen) openTreeKeys.add(nodeKey);
    else openTreeKeys.delete(nodeKey);
    updateUrlState();
}

function filterNavigator() {
    const input = document.getElementById('searchInput');
    const q = input.value.trim();
    document.getElementById('searchClear').classList.toggle('visible', !!q);
    if (currentNavigator === 'entities') renderEntityNavigator(q);
    else renderTree(filterTreeNodes(treeData, q.toLowerCase()));
    if (!q) restoreTreeSelection();
    else if (currentNavigator === 'apis') {
        document.querySelectorAll('.tree-children').forEach(c => c.classList.add('open'));
        document.querySelectorAll('.arrow').forEach(a => a.classList.add('open'));
    }
    replayAnimation(document.getElementById('treeContainer'), 'navigator-enter');
}

function filterTreeNodes(nodes, query) {
    if (!query) return nodes;
    return nodes.reduce((result, node) => {
        const children = filterTreeNodes(node.children || [], query);
        const ownText = [node.name, node.id, node.icon].filter(Boolean).join(' ').toLowerCase();
        if (ownText.includes(query) || children.length) result.push({ ...node, children });
        return result;
    }, []);
}

function clearNavigatorSearch() {
    const input = document.getElementById('searchInput');
    input.value = '';
    filterNavigator();
    input.focus();
}

function switchNavigator(navigator, updateState = true) {
    currentNavigator = navigator === 'entities' ? 'entities' : 'apis';
    document.getElementById('activityApis').classList.toggle('active', currentNavigator === 'apis');
    document.getElementById('activityEntities').classList.toggle('active', currentNavigator === 'entities');
    document.getElementById('mobileActivityApis').classList.toggle('active', currentNavigator === 'apis');
    document.getElementById('mobileActivityEntities').classList.toggle('active', currentNavigator === 'entities');
    document.getElementById('navigatorTitle').textContent = currentNavigator === 'apis' ? 'Endpoints' : 'Entities';
    const input = document.getElementById('searchInput');
    input.placeholder = currentNavigator === 'apis' ? 'Search endpoints' : 'Search entities';
    input.value = '';
    document.getElementById('searchClear').classList.remove('visible');
    if (currentNavigator === 'apis') {
        renderTree(treeData);
        restoreTreeSelection();
    } else {
        renderEntityNavigator('');
    }
    replayAnimation(document.getElementById('treeContainer'), 'navigator-enter');
    updateStats();
    if (updateState) updateUrlState();
}

function renderEntityNavigator(query) {
    const container = document.getElementById('treeContainer');
    const q = (query || '').toLowerCase();
    const entities = allEntities.filter(entity => [entity.name, entity.fullName, entity.description]
        .filter(Boolean).join(' ').toLowerCase().includes(q));
    container.innerHTML = '';
    if (!entities.length) {
        container.innerHTML = '<div class="navigator-empty">No entities found</div>';
        return;
    }
    const groups = [
        ['Models', entities.filter(entity => !entity.isEnum && entity.kind !== 'enum')],
        ['Enums', entities.filter(entity => entity.isEnum || entity.kind === 'enum')]
    ];
    groups.forEach(([label, items]) => {
        if (!items.length) return;
        const header = document.createElement('div');
        header.className = 'entity-nav-group';
        header.textContent = `${label} ${items.length}`;
        container.appendChild(header);
        items.sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach((entity, index) => {
            const item = document.createElement('div');
            item.className = 'entity-nav-item' + (currentEntity && currentEntity.fullName === entity.fullName ? ' active' : '');
            item.style.setProperty('--item-index', index);
            item.title = entity.fullName;
            item.onclick = () => selectEntity(entity.fullName);
            const packageName = (entity.fullName || '').split('.').slice(0, -1).join('.');
            const count = entity.isEnum || entity.kind === 'enum'
                ? (entity.enumValues || entity.values || []).length
                : (entity.fields || []).length;
            item.innerHTML = `<span class="entity-nav-icon">${iconSvg(entity.isEnum || entity.kind === 'enum' ? 'enum' : 'entity')}</span>`
                + `<span class="entity-nav-name">${esc(entity.name || entity.fullName)}</span>`
                + `<span class="entity-nav-package">${esc(packageName)}</span>`
                + `<span class="entity-nav-meta">${count}</span>`;
            container.appendChild(item);
        });
    });
}

function normalizeHttpMethod(method) {
    return (method || '').toString().trim().toUpperCase();
}

// ==================== Mode ====================
function setMode(mode) {
    currentMode = mode;
    document.querySelector('.mode-toggle').dataset.mode = mode;
    document.getElementById('btnDocMode').classList.toggle('active', mode === 'doc');
    document.getElementById('btnDebugMode').classList.toggle('active', mode === 'debug');
    if (currentApi) renderContent();
    updateWorkspaceChrome();
    updateUrlState();
}

// ==================== Select ====================
function selectApi(signature) {
    currentApi = allApis.find(a => a.methodSignature === signature);
    currentEntity = null;
    currentControllerClass = null;
    if (!currentApi) return;
    if (currentNavigator !== 'apis') switchNavigator('apis', false);
    setActiveTreeItem('api', signature);
    renderContent();
    closeMobileSidebar();
    updateUrlState();
}

function selectController(className) {
    currentApi = null;
    currentEntity = null;
    currentControllerClass = className;
    const apis = allApis.filter(a => a.controllerClass === className);
    if (currentNavigator !== 'apis') switchNavigator('apis', false);
    setActiveTreeItem('controller', className);
    renderControllerView(apis, className);
    updateWorkspaceChrome();
    closeMobileSidebar();
    updateUrlState();
}

function selectEntity(fullName) {
    currentEntity = allEntities.find(e => e.fullName === fullName);
    currentApi = null;
    currentControllerClass = null;
    if (!currentEntity) return;
    if (currentNavigator !== 'entities') switchNavigator('entities', false);
    renderEntityNavigator(document.getElementById('searchInput').value);
    renderContent();
    closeMobileSidebar();
    updateUrlState();
}

function clearActiveTreeItem() {
    document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
}

function setActiveTreeItem(type, id) {
    clearActiveTreeItem();
    let activeItem = null;
    document.querySelectorAll('.tree-item').forEach(el => {
        if (el.dataset.nodeType === type && el.dataset.nodeId === id) {
            activeItem = el;
            el.classList.add('active');
        }
    });
    if (activeItem) revealTreeItem(activeItem);
}

function restoreTreeSelection() {
    if (currentApi) setActiveTreeItem('api', currentApi.methodSignature);
    else if (currentControllerClass) setActiveTreeItem('controller', currentControllerClass);
    else clearActiveTreeItem();
}

function revealTreeItem(item) {
    let parent = item.parentElement;
    while (parent) {
        if (parent.classList && parent.classList.contains('tree-children')) {
            parent.classList.add('open');
            const parentItem = parent.previousElementSibling;
            if (parentItem) {
                const arrow = parentItem.querySelector('.arrow');
                if (arrow) arrow.classList.add('open');
                if (parentItem.dataset.treeKey) openTreeKeys.add(parentItem.dataset.treeKey);
            }
        }
        parent = parent.parentElement;
    }
}

// ==================== Render ====================
function renderContent() {
    const area = document.getElementById('contentArea');
    const empty = document.getElementById('emptyState');
    if (currentApi) {
        empty.style.display = 'none';
        area.style.display = '';
        if (currentMode === 'doc') renderDocView(area, currentApi);
        else renderDebugView(area, currentApi);
    } else if (currentEntity) {
        empty.style.display = 'none';
        area.style.display = '';
        renderEntityView(area, currentEntity);
    } else if (currentControllerClass) {
        empty.style.display = 'none';
        area.style.display = '';
        const apis = allApis.filter(a => a.controllerClass === currentControllerClass);
        renderControllerView(apis, currentControllerClass);
    } else {
        empty.style.display = '';
        area.style.display = 'none';
    }
    if (area.style.display !== 'none') replayAnimation(area, 'content-enter');
    updateWorkspaceChrome();
}

function getCurrentSelectionState() {
    if (currentApi) return { type: 'api', id: currentApi.methodSignature };
    if (currentEntity) return { type: 'entity', id: currentEntity.fullName };
    if (currentControllerClass) return { type: 'controller', id: currentControllerClass };
    return { type: '', id: '' };
}

function updateUrlState() {
    if (applyingUrlState) return;

    const params = new URLSearchParams(location.search);
    params.set('mode', currentMode);
    params.set('nav', currentNavigator);

    const selection = getCurrentSelectionState();
    if (selection.type && selection.id) {
        params.set('type', selection.type);
        params.set('id', selection.id);
    } else {
        params.delete('type');
        params.delete('id');
    }

    if (openTreeKeys.size) {
        params.set('open', Array.from(openTreeKeys).join('|'));
    } else {
        params.delete('open');
    }

    const query = params.toString();
    const nextUrl = location.pathname + (query ? '?' + query : '') + location.hash;
    history.replaceState(null, '', nextUrl);
}

function applyUrlState() {
    applyingUrlState = true;
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode');
    const navigator = params.get('nav');
    const type = params.get('type');
    const id = params.get('id');
    const open = params.get('open');

    openTreeKeys = new Set(open ? open.split('|').filter(Boolean) : []);
    switchNavigator(navigator === 'entities' ? 'entities' : 'apis', false);

    if (mode === 'debug' || mode === 'doc') {
        currentMode = mode;
        document.querySelector('.mode-toggle').dataset.mode = mode;
        document.getElementById('btnDocMode').classList.toggle('active', mode === 'doc');
        document.getElementById('btnDebugMode').classList.toggle('active', mode === 'debug');
    }

    applyingUrlState = false;

    if (type === 'api' && id && allApis.some(a => a.methodSignature === id)) {
        selectApi(id);
    } else if (type === 'controller' && id) {
        const hasController = treeData.some(node => treeContainsNode(node, 'controller', id));
        if (hasController) selectController(id);
        else updateUrlState();
    } else if (type === 'entity' && id && allEntities.some(e => e.fullName === id)) {
        selectEntity(id);
    } else {
        renderContent();
        updateUrlState();
    }
}

function treeContainsNode(node, type, id) {
    if (node.type === type && node.id === id) return true;
    return !!(node.children && node.children.some(child => treeContainsNode(child, type, id)));
}

function updateWorkspaceChrome() {
    let title = 'Marginalia';
    let section = 'Overview';
    let detail = '';
    let kind = 'file';
    if (currentApi) {
        title = currentApi.name || currentApi.path;
        section = (currentApi.controllerClass || 'Endpoints').split('.').pop();
        detail = `${normalizeHttpMethod(currentApi.httpMethod)} ${currentApi.path || ''}`;
    } else if (currentEntity) {
        title = currentEntity.name || currentEntity.fullName;
        section = 'Entities';
        detail = currentEntity.fullName || '';
        kind = currentEntity.isEnum || currentEntity.enum || currentEntity.kind === 'enum' ? 'enum' : 'entity';
    } else if (currentControllerClass) {
        title = currentControllerClass.split('.').pop();
        section = 'Controllers';
        detail = currentControllerClass;
        kind = 'controller';
    }
    const toolbarTitle = document.getElementById('toolbarTitle');
    const titleChanged = toolbarTitle.textContent !== title;
    toolbarTitle.textContent = title;
    toolbarTitle.title = title;
    document.getElementById('tabKind').innerHTML = iconSvg(kind);
    document.getElementById('breadcrumb').innerHTML = `<span class="crumb">Marginalia</span><span class="separator">/</span><span class="crumb">${esc(section)}</span><span class="separator">/</span><span class="crumb current">${esc(title)}</span>`;
    document.getElementById('statusSelection').textContent = detail || 'No selection';
    document.getElementById('modeStatus').textContent = currentMode.toUpperCase();
    document.getElementById('btnDocMode').disabled = !currentApi;
    document.getElementById('btnDebugMode').disabled = !currentApi;
    if (titleChanged) replayAnimation(toolbarTitle.closest('.editor-tab'), 'title-change');
}

function countTreeNodes(type) {
    let count = 0;
    const visit = nodes => nodes.forEach(node => {
        if (node.type === type) count++;
        if (node.children) visit(node.children);
    });
    visit(treeData);
    return count;
}

function updateStats() {
    const controllers = countTreeNodes('controller');
    const currentCount = currentNavigator === 'apis' ? allApis.length : allEntities.length;
    const count = document.getElementById('navigatorCount');
    if (count && count.textContent !== String(currentCount)) {
        count.textContent = currentCount;
        replayAnimation(count, 'bump');
    }
    const appStats = document.getElementById('appStats');
    if (appStats) appStats.textContent = `${controllers} controllers · ${allApis.length} endpoints · ${allEntities.length} entities`;
    const emptyStats = document.getElementById('emptyStats');
    if (emptyStats) emptyStats.textContent = `${allApis.length} endpoints and ${allEntities.length} entities indexed. Choose an item from the navigator.`;
}

function setAppStatus(message) {
    const appStatus = document.getElementById('appStatus');
    const sidebarStatus = document.getElementById('sidebarStatus');
    if (appStatus) appStatus.textContent = message;
    if (sidebarStatus) sidebarStatus.textContent = message;
    const footer = sidebarStatus && sidebarStatus.closest('.sidebar-footer');
    if (footer) footer.classList.toggle('busy', /indexing|rescan|loading/i.test(message));
}

function toggleSidebar() {
    document.body.classList.toggle('sidebar-open');
}

function closeMobileSidebar() {
    document.body.classList.remove('sidebar-open');
}

function initSidebarResize() {
    const resizer = document.getElementById('sidebarResizer');
    const saved = Number(localStorage.getItem('marginalia-sidebar-width'));
    if (saved >= 220 && saved <= 460) document.documentElement.style.setProperty('--sidebar-w', saved + 'px');
    let dragging = false;
    resizer.addEventListener('pointerdown', event => {
        dragging = true;
        resizer.classList.add('dragging');
        resizer.setPointerCapture(event.pointerId);
    });
    resizer.addEventListener('pointermove', event => {
        if (!dragging) return;
        const width = Math.max(220, Math.min(460, event.clientX - 42));
        document.documentElement.style.setProperty('--sidebar-w', width + 'px');
        localStorage.setItem('marginalia-sidebar-width', width);
    });
    const stop = () => { dragging = false; resizer.classList.remove('dragging'); };
    resizer.addEventListener('pointerup', stop);
    resizer.addEventListener('pointercancel', stop);
    resizer.addEventListener('dblclick', () => {
        document.documentElement.style.setProperty('--sidebar-w', '310px');
        localStorage.removeItem('marginalia-sidebar-width');
    });
}

function buildCommandItems(query) {
    const q = (query || '').trim().toLowerCase();
    const apis = allApis.map(api => ({
        kind: 'api', id: api.methodSignature, title: api.name || api.path,
        subtitle: `${api.httpMethod || ''} ${api.path || ''} ${(api.controllerClass || '').split('.').pop()}`,
        search: [api.name, api.path, api.httpMethod, api.controllerClass].filter(Boolean).join(' ').toLowerCase(),
        method: normalizeHttpMethod(api.httpMethod)
    }));
    const entities = allEntities.map(entity => ({
        kind: 'entity', id: entity.fullName, title: entity.name || entity.fullName,
        subtitle: entity.fullName || '', search: [entity.name, entity.fullName, entity.description].filter(Boolean).join(' ').toLowerCase()
    }));
    return apis.concat(entities).filter(item => !q || item.search.includes(q)).slice(0, 40);
}

function openCommandPalette() {
    const overlay = document.getElementById('commandPalette');
    const input = document.getElementById('commandInput');
    overlay.classList.add('open');
    input.value = '';
    commandIndex = 0;
    renderCommandResults();
    requestAnimationFrame(() => input.focus());
}

function closeCommandPalette() {
    document.getElementById('commandPalette').classList.remove('open');
}

function renderCommandResults() {
    commandItems = buildCommandItems(document.getElementById('commandInput').value);
    if (commandIndex >= commandItems.length) commandIndex = Math.max(0, commandItems.length - 1);
    const results = document.getElementById('commandResults');
    if (!commandItems.length) {
        results.innerHTML = '<div class="navigator-empty">No matching symbols</div>';
        return;
    }
    results.innerHTML = commandItems.map((item, index) => {
        const kind = item.kind === 'api' ? `<span class="method-badge method-${item.method}">${item.method}</span>` : iconSvg('entity');
        return `<div class="command-item${index === commandIndex ? ' active' : ''}" style="--item-index:${index}" data-index="${index}" onclick="activateCommand(${index})">`
            + `<span class="command-kind">${kind}</span><span class="command-title">${esc(item.title)}</span>`
            + `<span class="command-subtitle">${esc(item.subtitle)}</span><span class="command-type">${item.kind === 'api' ? 'Endpoint' : 'Entity'}</span></div>`;
    }).join('');
    const active = results.querySelector('.command-item.active');
    if (active) active.scrollIntoView({ block: 'nearest' });
}

function activateCommand(index) {
    const item = commandItems[index];
    if (!item) return;
    closeCommandPalette();
    if (item.kind === 'api') selectApi(item.id);
    else selectEntity(item.id);
}

function renderControllerView(apis, className) {
    const area = document.getElementById('contentArea');
    area.style.display = '';
    document.getElementById('emptyState').style.display = 'none';

    let html = '<div class="doc-view">';
    html += `<h2 style="margin-bottom:4px;">${esc(className.split('.').pop())}</h2>`;
    html += `<p style="color:var(--text-3);margin-bottom:20px;font-size:12px;font-family:var(--mono);">${esc(className)}</p>`;
    html += `<p style="margin-bottom:16px;color:var(--text-2);">${apis.length} endpoint(s)</p>`;

    html += '<table class="doc-table"><thead><tr><th>Method</th><th>Path</th><th>Name</th><th>Description</th></tr></thead><tbody>';
    apis.forEach(api => {
        const method = normalizeHttpMethod(api.httpMethod);
        const methodClass = 'method-' + method;
        html += `<tr style="cursor:pointer;" onclick="selectApi('${esc(api.methodSignature)}')">`;
        html += `<td><span class="method-badge ${methodClass}" style="font-size:11px;padding:2px 6px;">${method}</span></td>`;
        html += `<td class="param-name" style="font-size:13px;">${esc(api.path)}</td>`;
        html += `<td>${esc(api.name)}</td>`;
        html += `<td style="color:var(--text-2);font-size:13px;">${esc(api.description || '')}</td>`;
        html += '</tr>';
    });
    html += '</tbody></table>';

    html += '</div>';
    area.innerHTML = html;
}

function renderDocView(area, api) {
    const method = normalizeHttpMethod(api.httpMethod);
    const methodClass = 'method-' + method;
    let html = '<div class="doc-view">';

    // Header
    html += '<div class="doc-endpoint-header">';
    html += '<div class="path-line">';
    html += `<span class="method-badge-lg ${methodClass}">${method}</span>`;
    html += `<span class="path-text">${esc(api.path)}</span>`;
    if (api.sse) html += '<span class="badge-sse">SSE</span>';
    if (api.deprecated) html += '<span class="badge-deprecated">Deprecated</span>';
    html += '<span class="endpoint-actions">';
    html += `<button class="action-btn" onclick="copyCurrentPath()" title="Copy path">${iconSvg('file')} Copy path</button>`;
    html += `<button class="action-btn" onclick="openEditApi()">${iconSvg('controller')} Edit</button>`;
    html += '</span>';
    html += '</div>';
    html += `<div class="name">${esc(api.name)}</div>`;
    if (api.description && api.description !== api.name) html += `<div class="desc">${esc(api.description)}</div>`;
    if (api.tags && api.tags.length) html += '<div style="margin-top:6px">' + api.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('') + '</div>';
    html += '</div>';

    // Path Variables
    if (api.pathVariables && api.pathVariables.length) {
        html += renderParamTable('Path Variables', api.pathVariables);
    }

    // Query Params
    if (api.queryParams && api.queryParams.length) {
        html += renderParamTable('Query Parameters', api.queryParams);
    }

    // Form Params
    if (api.formParams && api.formParams.length) {
        html += renderParamTable('Form Parameters', api.formParams);
    }

    // Header Params
    if (api.headerParams && api.headerParams.length) {
        html += renderParamTable('Header Parameters', api.headerParams);
    }

    // Request Body
    if (api.requestBody) {
        const reqEntityRef = api.requestBody.entityRef || resolveEntityRef(api.requestBody.type);
        html += '<div class="doc-section"><h3>Request Body</h3>';
        html += '<div style="margin-bottom:8px">';
        if (reqEntityRef) {
            html += `<span class="entity-link" onclick="selectEntity('${esc(reqEntityRef)}')">${esc(api.requestBody.type)}</span>`;
        } else if (api.requestBody.type) {
            html += `<span class="param-type">${esc(api.requestBody.type)}</span>`;
        }
        if (api.requestBody.required === false) html += ' <span class="optional">optional</span>';
        else html += ' <span class="required">required</span>';
        html += '</div>';
        if (api.requestBody.description) html += `<p style="color:var(--text-2);margin-bottom:8px;">${esc(api.requestBody.description)}</p>`;
        if (reqEntityRef) {
            html += renderEntityFieldsInline(reqEntityRef);
        }
        if (api.requestBody.example) html += '<div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button>' + syntaxHighlight(api.requestBody.example) + '</div>';
        html += '</div>';
    }

    // Response
    if (api.response) {
        const respEntityRef = api.response.entityRef || resolveEntityRef(api.response.type);
        html += '<div class="doc-section"><h3>Response</h3>';
        html += `<div style="margin-bottom:8px"><span style="color:var(--green);font-weight:700">${api.response.statusCode || 200}</span>`;
        if (respEntityRef) {
            html += ` <span class="entity-link" onclick="selectEntity('${esc(respEntityRef)}')">${esc(api.response.type)}</span>`;
        } else if (api.response.type) {
            html += ` <span class="param-type">${esc(api.response.type)}</span>`;
        }
        html += '</div>';
        if (api.response.description) html += `<p style="color:var(--text-2);margin-bottom:8px;">${esc(api.response.description)}</p>`;
        if (respEntityRef) {
            html += renderEntityFieldsInline(respEntityRef);
        }
        if (api.response.example) html += '<div class="code-block"><button class="copy-btn" onclick="copyCode(this)">Copy</button>' + syntaxHighlight(api.response.example) + '</div>';
        html += '</div>';
    }

    html += '</div>';
    area.innerHTML = html;
}

function renderParamTable(title, params) {
    let html = `<div class="doc-section"><h3>${esc(title)}</h3><table class="doc-table"><thead><tr><th>Name</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody>`;
    params.forEach(p => {
        html += '<tr>';
        html += `<td class="param-name">${esc(p.name)}</td>`;
        html += `<td class="param-type">${esc(p.type)}</td>`;
        html += `<td>${p.required !== false ? '<span class="required">required</span>' : '<span class="optional">optional</span>'}</td>`;
        html += `<td>${esc(p.description || '')}${p.defaultValue ? ' <em>(default: ' + esc(p.defaultValue) + ')</em>' : ''}</td>`;
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
}

/**
 * 从类型字符串中解析实体引用，支持嵌套泛型如 R<List<User>>
 * 优先匹配最内层类型
 */
function resolveEntityRef(type) {
    if (!type) return null;
    // 直接匹配
    let entity = allEntities.find(e => e.fullName === type || e.name === type);
    if (entity) return entity.fullName;
    // 提取所有类名（从泛型中），反转使得最内层优先
    const names = [];
    let depth = 0, buf = '';
    for (const ch of type) {
        if (ch === '<') { depth++; if (buf.trim()) names.push(buf.trim()); buf = ''; }
        else if (ch === '>') { if (buf.trim()) names.push(buf.trim()); buf = ''; depth--; }
        else if (ch === ',' || ch === ' ') { if (depth > 0 && buf.trim()) { names.push(buf.trim()); buf = ''; } }
        else if (depth > 0) { buf += ch; }
    }
    if (buf.trim()) names.push(buf.trim());
    // 从后往前找（最内层优先）
    for (let i = names.length - 1; i >= 0; i--) {
        const n = names[i];
        if (/^[A-Z]/.test(n)) {
            entity = allEntities.find(e => e.name === n || e.fullName.endsWith('.' + n));
            if (entity) return entity.fullName;
        }
    }
    return null;
}

function renderEntityFieldsInline(entityFullName) {
    const entity = allEntities.find(e => e.fullName === entityFullName);
    if (!entity || ((entity.isEnum || entity.enum) && !hasEnumValues(entity)) || (!entity.isEnum && !entity.enum && (!entity.fields || entity.fields.length === 0))) return '';

    let html = '<div style="margin:8px 0;padding:12px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);">';
    html += `<div style="margin-bottom:8px;"><span class="entity-link" onclick="selectEntity('${esc(entity.fullName)}')" style="font-weight:700;font-size:14px;">${esc(entity.name)}</span>`;
    if (entity.description) html += `<span style="color:var(--text-3);font-size:12px;margin-left:8px;">${esc(entity.description)}</span>`;
    html += '</div>';
    if (entity.isEnum || entity.enum) {
        html += renderEnumValues(entity, 0);
    } else {
        html += '<table class="doc-table" style="margin:0;"><thead><tr><th style="width:20%">Field</th><th style="width:15%">Type</th><th>Description</th><th style="width:15%">Example</th></tr></thead><tbody>';
        html += renderFieldRows(entity, 0, new Set([entity.fullName]), false);
        html += '</tbody></table>';
    }
    html += '</div>';
    return html;
}

function renderFieldRows(entity, depth, visited, showRequired) {
    if (!entity || !entity.fields) return '';
    let html = '';
    entity.fields.forEach(f => {
        const child = resolveFieldEntity(f);
        const indent = depth * 22;
        html += '<tr>';
        html += `<td class="param-name"><span style="display:inline-block;margin-left:${indent}px">${esc(f.name)}</span></td>`;
        html += `<td class="param-type">${renderTypeCell(f, child)}</td>`;
        if (showRequired) {
            html += `<td>${f.required !== false ? '<span class="required">required</span>' : '<span class="optional">optional</span>'}</td>`;
        }
        html += `<td style="color:var(--text-2);">${esc(f.description || '')}</td>`;
        html += `<td style="color:var(--text-3);font-size:12px;font-family:var(--mono);">${esc(f.example || '')}</td>`;
        html += '</tr>';

        if (child && (child.isEnum || child.enum)) {
            html += renderEnumRows(child, depth + 1, showRequired, false);
        } else if (child && child.fields && child.fields.length && !visited.has(child.fullName)) {
            const nextVisited = new Set(visited);
            nextVisited.add(child.fullName);
            html += renderFieldRows(child, depth + 1, nextVisited, showRequired);
        }
    });
    return html;
}

function renderTypeCell(field, child) {
    const type = field.type || '';
    if (!child) return esc(type);
    return `<span class="entity-link" onclick="selectEntity('${esc(child.fullName)}')">${esc(type)}</span>`;
}

function resolveFieldEntity(field) {
    if (!field) return null;
    if (field.entityRef) {
        const byRef = allEntities.find(e => e.fullName === field.entityRef);
        if (byRef) return byRef;
    }
    const ref = resolveEntityRef(field.fullType || field.type);
    return ref ? allEntities.find(e => e.fullName === ref) : null;
}

function hasEnumValues(entity) {
    return !!(entity && ((entity.enumValueDocs && entity.enumValueDocs.length) || (entity.enumValues && entity.enumValues.length)));
}

function getEnumValueDocs(entity) {
    if (!entity) return [];
    if (entity.enumValueDocs && entity.enumValueDocs.length) return entity.enumValueDocs;
    return (entity.enumValues || []).map(value => {
        if (value && typeof value === 'object') {
            return {
                name: value.name || value.value || value.constant || '',
                description: value.description || value.desc || value.comment || ''
            };
        }
        return { name: value, description: '' };
    });
}

function renderEnumValues(entity, depth) {
    let html = '<table class="doc-table" style="margin:0;"><thead><tr><th style="width:35%">Value</th><th>Description</th></tr></thead><tbody>';
    html += renderEnumRows(entity, depth, false, true);
    html += '</tbody></table>';
    return html;
}

function renderEnumRows(entity, depth, showRequired, compact) {
    const indent = depth * 22;
    return getEnumValueDocs(entity).map(v => {
        let html = '<tr>';
        html += `<td class="param-name"><span style="display:inline-block;margin-left:${indent}px">${esc(v.name || v)}</span></td>`;
        if (!compact) {
            html += '<td></td>';
            if (showRequired) html += '<td></td>';
        }
        html += `<td style="color:var(--text-2);">${esc(v.description || '')}</td>`;
        if (!compact) html += '<td></td>';
        return html + '</tr>';
    }).join('');
}

function renderEntityView(area, entity) {
    let html = '<div class="doc-view">';
    html += '<div class="doc-endpoint-header">';
    html += `<div class="name">${esc(entity.name)}</div>`;
    if (entity.description) html += `<div class="desc">${esc(entity.description)}</div>`;
    if (entity.superClass) html += `<p style="color:var(--text-3);margin-top:4px">extends <span class="param-type">${esc(entity.superClass)}</span></p>`;
    html += '<button class="btn-secondary" style="margin-top:8px;padding:4px 10px;font-size:12px;" onclick="openEditEntity()">Edit</button>';
    html += '</div>';

    if (entity.isEnum || entity.enum) {
        html += '<div class="doc-section"><h3>Enum Values</h3>';
        html += renderEnumValues(entity, 0);
        html += '</div>';
    } else if (entity.fields && entity.fields.length) {
        html += '<div class="doc-section"><h3>Fields</h3><table class="doc-table"><thead><tr><th>Field</th><th>Type</th><th>Required</th><th>Description</th><th>Example</th></tr></thead><tbody>';
        html += renderFieldRows(entity, 0, new Set([entity.fullName]), true);
        html += '</tbody></table></div>';
    }

    // Show which APIs use this entity
    const usedBy = allApis.filter(a =>
        (a.requestBody && a.requestBody.entityRef === entity.fullName) ||
        (a.response && a.response.entityRef === entity.fullName) ||
        apiUsesEntity(a, entity.fullName)
    );
    if (usedBy.length) {
        html += '<div class="doc-section"><h3>Used By</h3>';
        usedBy.forEach(a => {
            const method = normalizeHttpMethod(a.httpMethod);
            html += `<p style="cursor:pointer;color:var(--accent);margin:4px 0;" onclick="selectApi('${esc(a.methodSignature)}')">`;
            html += `<span class="method-badge method-${method}" style="font-size:9px;padding:1px 4px;">${method}</span> ${esc(a.name)} <span style="color:var(--text-3)">${esc(a.path)}</span></p>`;
        });
        html += '</div>';
    }

    html += '</div>';
    area.innerHTML = html;
}

function apiUsesEntity(api, entityFullName) {
    const roots = [];
    if (api.requestBody) roots.push(api.requestBody.entityRef || resolveEntityRef(api.requestBody.fullType || api.requestBody.type));
    if (api.response) roots.push(api.response.entityRef || resolveEntityRef(api.response.fullType || api.response.type));
    return roots.some(root => root && entityTreeContains(root, entityFullName, new Set()));
}

function entityTreeContains(rootFullName, targetFullName, visited) {
    if (rootFullName === targetFullName) return true;
    if (!rootFullName || visited.has(rootFullName)) return false;
    visited.add(rootFullName);
    const root = allEntities.find(e => e.fullName === rootFullName);
    if (!root || !root.fields) return false;
    return root.fields.some(field => {
        const child = resolveFieldEntity(field);
        return child && entityTreeContains(child.fullName, targetFullName, visited);
    });
}

// ==================== Debug Mode ====================
function renderDebugView(area, api) {
    if (sseSource) { sseSource.close(); sseSource = null; }

    let html = '<div class="debug-view">';

    // URL bar
    html += '<div class="debug-request">';
    html += '<div class="debug-url-bar">';
    const debugMethod = api.debugMethod || api.httpMethod;
    html += `<select id="debugMethod"><option ${debugMethod==='GET'?'selected':''}>GET</option><option ${debugMethod==='POST'?'selected':''}>POST</option><option ${debugMethod==='PUT'?'selected':''}>PUT</option><option ${debugMethod==='DELETE'?'selected':''}>DELETE</option><option ${debugMethod==='PATCH'?'selected':''}>PATCH</option></select>`;
    const origin = location.origin;
    const debugUrl = api.debugUrl || (origin + api.path);
    html += `<input type="text" id="debugUrl" value="${esc(debugUrl)}">`;
    html += '<button id="debugSendButton" onclick="sendRequest()">Send</button>';
    if (api.sse) html += '<button class="sse-btn" onclick="connectSSE()">SSE</button>';
    html += '</div></div>';

    // Tabs
    html += '<div class="debug-tabs">';
    html += '<button class="active" onclick="switchDebugTab(this,\'paramsTab\')">Params</button>';
    html += '<button onclick="switchDebugTab(this,\'headersTab\')">Headers</button>';
    html += '<button onclick="switchDebugTab(this,\'bodyTab\')">Body</button>';
    html += '</div>';

    // Build persisted params map (debug params override API params)
    const persistedParams = api.debugParams || {};
    const persistedParamDescs = api.debugParamDescs || {};
    // Merge declared form/query params, then overlay persisted debug values.
    // Explicit query params win when a ModelAttribute field has the same name.
    const mergedParams = {};
    const declaredParams = [...(api.formParams || []), ...(api.queryParams || [])];
    declaredParams.forEach(p => {
        const val = persistedParams.hasOwnProperty(p.name) ? persistedParams[p.name] : (p.defaultValue || p.example || '');
        const desc = persistedParamDescs.hasOwnProperty(p.name) ? persistedParamDescs[p.name] : (p.description || '');
        mergedParams[p.name] = { value: val, description: desc };
    });
    Object.keys(persistedParams).forEach(k => {
        if (!mergedParams[k]) mergedParams[k] = { value: persistedParams[k], description: persistedParamDescs[k] || '' };
    });

    // Params tab
    html += '<div class="debug-tab-content" id="paramsTab">';
    html += '<table class="kv-table" id="paramsTable"><thead><tr><th style="width:25%">Key</th><th style="width:30%">Value</th><th style="width:35%">Description</th><th style="width:10%"></th></tr></thead><tbody>';
    Object.entries(mergedParams).forEach(([name, info]) => {
        html += `<tr><td><input value="${esc(name)}" class="kv-key"></td><td><input value="${esc(info.value)}" class="kv-val"></td><td><input value="${esc(info.description)}" class="kv-desc" placeholder="description"></td><td><button class="del-btn" onclick="removeDebugRow(this)">&times;</button></td></tr>`;
    });
    html += '</tbody></table>';
    html += '<button class="add-row-btn" onclick="addDebugKvRow(\'paramsTable\')">+ Add Parameter</button>';
    html += '</div>';

    // Build persisted headers map
    const persistedHeaders = api.debugHeaders || {};
    const persistedHeaderDescs = api.debugHeaderDescs || {};
    // Default: Content-Type if no persisted headers
    const mergedHeaders = {};
    if (Object.keys(persistedHeaders).length > 0) {
        Object.entries(persistedHeaders).forEach(([k, v]) => {
            mergedHeaders[k] = { value: v, description: persistedHeaderDescs[k] || '' };
        });
    } else {
        mergedHeaders['Content-Type'] = { value: 'application/json', description: '' };
    }

    // Headers tab
    html += '<div class="debug-tab-content" id="headersTab" style="display:none">';
    html += '<table class="kv-table" id="headersTable"><thead><tr><th style="width:25%">Key</th><th style="width:30%">Value</th><th style="width:35%">Description</th><th style="width:10%"></th></tr></thead><tbody>';
    Object.entries(mergedHeaders).forEach(([name, info]) => {
        html += `<tr><td><input value="${esc(name)}" class="kv-key"></td><td><input value="${esc(info.value)}" class="kv-val"></td><td><input value="${esc(info.description)}" class="kv-desc" placeholder="description"></td><td><button class="del-btn" onclick="removeDebugRow(this)">&times;</button></td></tr>`;
    });
    html += '</tbody></table>';
    html += '<button class="add-row-btn" onclick="addDebugKvRow(\'headersTable\')">+ Add Header</button>';
    html += '</div>';

    // Body tab - field-level editor with JSON toggle
    html += '<div class="debug-tab-content" id="bodyTab" style="display:none">';
    html += '<div class="debug-body-tabs" style="display:flex;gap:8px;margin-bottom:8px;">';
    html += '<button class="btn-secondary active" id="bodyFieldTabBtn" onclick="switchBodyTab(\'field\')" style="padding:4px 12px;font-size:12px;">Fields</button>';
    html += '<button class="btn-secondary" id="bodyJsonTabBtn" onclick="switchBodyTab(\'json\')" style="padding:4px 12px;font-size:12px;">JSON</button>';
    html += '</div>';

    // Field-level editor
    html += '<div id="bodyFieldEditor">';
    const debugBody = api.debugBody || '';
    const reqEntityRef = api.requestBody ? (api.requestBody.entityRef || resolveEntityRef(api.requestBody.type)) : null;
    const entityForBody = reqEntityRef ? allEntities.find(e => e.fullName === reqEntityRef) : null;
    let bodyObj = null;
    if (debugBody) {
        try { bodyObj = JSON.parse(debugBody); } catch(e) { bodyObj = null; }
    }
    if (entityForBody && entityForBody.fields && entityForBody.fields.length > 0) {
        // Generate from entity fields
        if (!bodyObj) bodyObj = generateJsonFromEntity(entityForBody);
        html += '<table class="kv-table" id="bodyFieldsTable"><thead><tr><th style="width:20%">Field</th><th style="width:15%">Type</th><th style="width:30%">Value</th><th style="width:25%">Description</th><th style="width:10%"></th></tr></thead><tbody>';
        entityForBody.fields.forEach(f => {
            const val = bodyObj && bodyObj.hasOwnProperty(f.name) ? JSON.stringify(bodyObj[f.name]) : (f.example ? f.example : getDefaultValue(f.type));
            html += `<tr data-field="${esc(f.name)}" data-type="${esc(f.type)}">`;
            html += `<td><span class="param-name" style="font-size:12px;">${esc(f.name)}</span></td>`;
            html += `<td><span class="param-type" style="font-size:11px;">${esc(f.type)}</span></td>`;
            html += `<td><input value="${esc(val.replace(/^"|"$/g, ''))}" class="body-field-val"></td>`;
            html += `<td><span style="font-size:11px;color:var(--text-2);">${esc(f.description || '')}</span></td>`;
            html += `<td></td></tr>`;
        });
        html += '</tbody></table>';
    } else {
        // No entity - show raw textarea
        html += '<textarea id="debugBody" rows="8" style="width:100%;font-family:monospace;" placeholder="Request body (JSON)">';
        html += esc(debugBody || (api.requestBody ? '{}' : ''));
        html += '</textarea>';
    }
    html += '</div>';

    // Raw JSON editor (hidden by default)
    html += '<div id="bodyJsonEditor" style="display:none">';
    html += '<textarea id="debugBodyJson" rows="8" style="width:100%;font-family:monospace;" placeholder="Request body (JSON)">';
    html += esc(debugBody || (api.requestBody ? '{}' : ''));
    html += '</textarea>';
    html += '</div>';
    html += '</div>';

    // Response area
    html += '<div class="debug-response" id="debugResponse">';
    html += '<div class="debug-response-header" id="debugResponseHeader" style="display:none">';
    html += '<span>Status: <span class="status" id="debugStatus"></span></span>';
    html += '<span id="debugTime" style="color:var(--text-3)"></span>';
    html += '<button class="btn-secondary" style="margin-left:auto;padding:3px 10px;font-size:12px;" onclick="updateExample()" id="updateExampleBtn" style="display:none">Use as Example</button>';
    html += '</div>';
    html += '<div class="debug-response-body"><pre id="debugResponseBody">Response will appear here...</pre></div>';
    html += '<div class="sse-events" id="sseEvents" style="display:none"></div>';
    html += '</div>';

    html += '</div>';
    area.innerHTML = html;

    // Restore persisted response if available
    if (api.debugResponse) {
        const header = document.getElementById('debugResponseHeader');
        const status = document.getElementById('debugStatus');
        const body = document.getElementById('debugResponseBody');
        header.style.display = '';
        status.textContent = 'cached';
        status.className = 'status ok';
        try { body.innerHTML = syntaxHighlight(api.debugResponse); } catch(e) { body.textContent = api.debugResponse; }
        document.getElementById('updateExampleBtn').style.display = '';
    }
}

function switchDebugTab(btn, tabId) {
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.debug-tab-content').forEach(t => t.style.display = 'none');
    const tab = document.getElementById(tabId);
    tab.style.display = '';
    replayAnimation(tab, 'tab-enter');
}

function addKvRow(tableId) {
    const tbody = document.querySelector('#' + tableId + ' tbody');
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><input class="kv-key"></td><td><input class="kv-val"></td><td><button class="del-btn" onclick="removeDebugRow(this)">&times;</button></td>';
    tbody.appendChild(tr);
    requestAnimationFrame(() => tr.querySelector('input')?.focus());
}

function addDebugKvRow(tableId) {
    const tbody = document.querySelector('#' + tableId + ' tbody');
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><input class="kv-key"></td><td><input class="kv-val"></td><td><input class="kv-desc" placeholder="description"></td><td><button class="del-btn" onclick="removeDebugRow(this)">&times;</button></td>';
    tbody.appendChild(tr);
    requestAnimationFrame(() => tr.querySelector('input')?.focus());
}

function removeDebugRow(button) {
    const row = button.closest('tr');
    if (!row) return;
    row.classList.add('row-leave');
    setTimeout(() => row.remove(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 110);
}

function getKvPairs(tableId) {
    const pairs = {};
    document.querySelectorAll('#' + tableId + ' tbody tr').forEach(tr => {
        const key = tr.querySelector('.kv-key')?.value?.trim();
        const val = tr.querySelector('.kv-val')?.value?.trim();
        if (key) pairs[key] = val || '';
    });
    return pairs;
}

function getDebugKvPairsWithDesc(tableId) {
    const pairs = {};
    const descs = {};
    document.querySelectorAll('#' + tableId + ' tbody tr').forEach(tr => {
        const key = tr.querySelector('.kv-key')?.value?.trim();
        const val = tr.querySelector('.kv-val')?.value?.trim();
        const desc = tr.querySelector('.kv-desc')?.value?.trim();
        if (key) {
            pairs[key] = val || '';
            if (desc) descs[key] = desc;
        }
    });
    return { pairs, descs };
}

function generateJsonFromEntity(entity) {
    if (!entity || !entity.fields) return {};
    const obj = {};
    entity.fields.forEach(f => {
        if (f.example) {
            try { obj[f.name] = JSON.parse(f.example); } catch(e) { obj[f.name] = f.example; }
        } else {
            obj[f.name] = getDefaultValue(f.type);
        }
    });
    return obj;
}

function getDefaultValue(type) {
    if (!type) return '';
    const t = type.toLowerCase();
    if (t === 'int' || t === 'integer' || t === 'long' || t === 'double' || t === 'float' || t === 'short' || t === 'byte') return 0;
    if (t === 'boolean') return false;
    if (t === 'string') return '';
    if (t.startsWith('list') || t.startsWith('array')) return [];
    if (t.startsWith('map') || t.startsWith('object')) return {};
    return '';
}

function switchBodyTab(tab) {
    const fieldBtn = document.getElementById('bodyFieldTabBtn');
    const jsonBtn = document.getElementById('bodyJsonTabBtn');
    const fieldEditor = document.getElementById('bodyFieldEditor');
    const jsonEditor = document.getElementById('bodyJsonEditor');
    if (tab === 'field') {
        fieldBtn.classList.add('active');
        jsonBtn.classList.remove('active');
        fieldEditor.style.display = '';
        jsonEditor.style.display = 'none';
        // Sync JSON -> fields: parse JSON and update field values
        const jsonArea = document.getElementById('debugBodyJson');
        if (jsonArea) {
            try {
                const obj = JSON.parse(jsonArea.value);
                document.querySelectorAll('#bodyFieldsTable tbody tr').forEach(tr => {
                    const fieldName = tr.dataset.field;
                    if (fieldName && obj.hasOwnProperty(fieldName)) {
                        const input = tr.querySelector('.body-field-val');
                        if (input) {
                            const v = obj[fieldName];
                            input.value = typeof v === 'object' ? JSON.stringify(v) : v;
                        }
                    }
                });
            } catch(e) {}
        }
    } else {
        fieldBtn.classList.remove('active');
        jsonBtn.classList.add('active');
        fieldEditor.style.display = 'none';
        jsonEditor.style.display = '';
        // Sync fields -> JSON: build JSON from field values
        const fieldsTable = document.getElementById('bodyFieldsTable');
        if (fieldsTable) {
            const obj = {};
            fieldsTable.querySelectorAll('tbody tr').forEach(tr => {
                const fieldName = tr.dataset.field;
                const fieldType = tr.dataset.type;
                const input = tr.querySelector('.body-field-val');
                if (fieldName && input) {
                    let val = input.value.trim();
                    if (val === '') {
                        obj[fieldName] = getDefaultValue(fieldType);
                    } else {
                        try { obj[fieldName] = JSON.parse(val); } catch(e) { obj[fieldName] = val; }
                    }
                }
            });
            const jsonArea = document.getElementById('debugBodyJson');
            if (jsonArea) jsonArea.value = JSON.stringify(obj, null, 2);
        }
    }
}

function getDebugBody() {
    // Try field editor first
    const fieldsTable = document.getElementById('bodyFieldsTable');
    if (fieldsTable && fieldsTable.offsetParent !== null) {
        const obj = {};
        fieldsTable.querySelectorAll('tbody tr').forEach(tr => {
            const fieldName = tr.dataset.field;
            const fieldType = tr.dataset.type;
            const input = tr.querySelector('.body-field-val');
            if (fieldName && input) {
                let val = input.value.trim();
                if (val === '') {
                    obj[fieldName] = getDefaultValue(fieldType);
                } else {
                    try { obj[fieldName] = JSON.parse(val); } catch(e) { obj[fieldName] = val; }
                }
            }
        });
        return JSON.stringify(obj, null, 2);
    }
    // Try JSON textarea
    const jsonArea = document.getElementById('debugBodyJson');
    if (jsonArea && jsonArea.offsetParent !== null) return jsonArea.value;
    // Fallback raw textarea
    const rawArea = document.getElementById('debugBody');
    return rawArea ? rawArea.value : '';
}

async function saveDebugState(responseBody) {
    if (!currentApi) return;
    const url = document.getElementById('debugUrl').value;
    const method = document.getElementById('debugMethod').value;
    const { pairs: headers, descs: headerDescs } = getDebugKvPairsWithDesc('headersTable');
    const { pairs: params, descs: paramDescs } = getDebugKvPairsWithDesc('paramsTable');
    const body = getDebugBody();

    // Init persistMeta if missing
    if (!currentApi.persistMeta) {
        currentApi.persistMeta = { userModified: true, modifiedFields: [], lastModified: new Date().toISOString(), version: 1 };
    }
    currentApi.persistMeta.userModified = true;
    currentApi.persistMeta.lastModified = new Date().toISOString();
    if (!currentApi.persistMeta.modifiedFields) currentApi.persistMeta.modifiedFields = [];
    const mf = currentApi.persistMeta.modifiedFields;

    // Update debug-specific fields
    currentApi.debugMethod = method;
    currentApi.debugUrl = url;
    currentApi.debugHeaders = headers;
    currentApi.debugParams = params;
    currentApi.debugHeaderDescs = headerDescs;
    currentApi.debugParamDescs = paramDescs;
    currentApi.debugBody = body;
    if (responseBody !== undefined) currentApi.debugResponse = responseBody;

    // Sync back to shared fields so doc mode also sees the edits
    // Mark each synced field as user-modified so mergeApi preserves them on re-scan
    // 1. Sync header descriptions to headerParams
    if (!currentApi.headerParams) currentApi.headerParams = [];
    Object.entries(headers).forEach(([k, v]) => {
        let existing = currentApi.headerParams.find(p => p.name === k);
        if (existing) {
            if (headerDescs[k]) { existing.description = headerDescs[k]; mf.push('headerParams.' + k + '.description'); }
        } else {
            currentApi.headerParams.push({ name: k, type: 'String', description: headerDescs[k] || '' });
            mf.push('headerParams.' + k + '.description');
        }
    });
    // 2. Sync param descriptions and values to queryParams
    if (!currentApi.queryParams) currentApi.queryParams = [];
    Object.entries(params).forEach(([k, v]) => {
        let existing = currentApi.queryParams.find(p => p.name === k);
        if (existing) {
            if (paramDescs[k]) { existing.description = paramDescs[k]; mf.push('queryParams.' + k + '.description'); }
            if (v) { existing.example = v; mf.push('queryParams.' + k + '.example'); }
        } else {
            currentApi.queryParams.push({ name: k, type: 'String', description: paramDescs[k] || '', example: v || '' });
            mf.push('queryParams.' + k + '.description');
        }
    });
    // 3. Sync request body example
    if (body && currentApi.requestBody) {
        currentApi.requestBody.example = body;
        if (!mf.includes('requestBody.example')) mf.push('requestBody.example');
    }

    // Deduplicate modifiedFields
    currentApi.persistMeta.modifiedFields = [...new Set(mf)];

    // Persist to backend
    try {
        const res = await fetch(API + '/endpoints/' + encodeURIComponent(currentApi.methodSignature), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentApi)
        });
        if (res.ok) {
            const saved = await res.json();
            // Update allApis entry so page refresh doesn't lose data
            const idx = allApis.findIndex(a => a.methodSignature === currentApi.methodSignature);
            if (idx >= 0) allApis[idx] = saved;
            currentApi = saved;
        }
    } catch (e) {
        console.error('Failed to save debug state', e);
    }
}

async function sendRequest() {
    const method = document.getElementById('debugMethod').value;
    const url = document.getElementById('debugUrl').value;
    const params = getKvPairs('paramsTable');
    const headers = getKvPairs('headersTable');
    const body = getDebugBody();
    const sendButton = document.getElementById('debugSendButton');

    if (sendButton) sendButton.classList.add('is-loading');
    document.getElementById('debugResponseBody').textContent = 'Loading...';
    document.getElementById('debugResponseHeader').style.display = 'none';
    document.getElementById('sseEvents').style.display = 'none';
    document.getElementById('sseEvents').innerHTML = '';

    try {
        const res = await fetch(API + '/debug', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ method, url, headers, queryParams: params, body: body || null })
        });
        const data = await res.json();
        showDebugResponse(data);
        // Auto-save debug state with response
        if (!data.error) {
            await saveDebugState(data.body || '');
        } else {
            await saveDebugState();
        }
    } catch (e) {
        document.getElementById('debugResponseBody').textContent = 'Error: ' + e.message;
        replayAnimation(document.getElementById('debugResponse'), 'response-ready');
        await saveDebugState();
    } finally {
        if (sendButton) sendButton.classList.remove('is-loading');
    }
}

function showDebugResponse(data) {
    const header = document.getElementById('debugResponseHeader');
    const status = document.getElementById('debugStatus');
    const time = document.getElementById('debugTime');
    const body = document.getElementById('debugResponseBody');

    header.style.display = '';
    document.getElementById('sseEvents').style.display = 'none';

    if (data.error) {
        status.textContent = 'Error';
        status.className = 'status err';
        body.textContent = data.error;
    } else {
        status.textContent = data.statusCode;
        status.className = 'status ' + (data.statusCode >= 200 && data.statusCode < 400 ? 'ok' : 'err');
        time.textContent = data.elapsedMs + 'ms';
        try {
            body.innerHTML = syntaxHighlight(data.body || '');
        } catch (e) {
            body.textContent = data.body || '';
        }
        document.getElementById('updateExampleBtn').style.display = '';
    }
    replayAnimation(document.getElementById('debugResponse'), 'response-ready');
}

function connectSSE() {
    const url = document.getElementById('debugUrl').value;
    const headers = getKvPairs('headersTable');
    const headerStr = Object.entries(headers).map(([k,v]) => k + ':' + v).join(';');

    document.getElementById('debugResponseBody').style.display = 'none';
    document.getElementById('sseEvents').style.display = '';
    document.getElementById('sseEvents').innerHTML = '';
    document.getElementById('debugResponseHeader').style.display = '';

    const statusEl = document.getElementById('debugStatus');
    statusEl.textContent = 'Connected';
    statusEl.className = 'status ok';

    const eventsEl = document.getElementById('sseEvents');
    const sseUrl = API + '/debug/sse?url=' + encodeURIComponent(url) + (headerStr ? '&headers=' + encodeURIComponent(headerStr) : '');

    if (sseSource) sseSource.close();
    sseSource = new EventSource(sseUrl);
    sseSource.onmessage = (e) => {
        const div = document.createElement('div');
        div.className = 'sse-event';
        div.textContent = e.data;
        eventsEl.appendChild(div);
        eventsEl.scrollTop = eventsEl.scrollHeight;
    };
    sseSource.onerror = () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'status err';
        sseSource.close();
    };
}

async function updateExample() {
    if (!currentApi) return;
    const body = document.getElementById('debugResponseBody').textContent;
    try {
        const res = await fetch(API + '/endpoints/' + encodeURIComponent(currentApi.methodSignature) + '/update-example', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: body
        });
        if (res.ok) {
            currentApi = await res.json();
            showToast('Example updated');
        }
    } catch (e) { showToast('Failed: ' + e.message); }
}

// ==================== Edit ====================
function openEditApi() {
    if (!currentApi) return;
    const modal = document.getElementById('editModal');
    const body = document.getElementById('editModalBody');
    document.getElementById('editModalTitle').textContent = 'Edit API: ' + currentApi.name;

    let html = '';
    html += formField('Name', 'editName', currentApi.name || '');
    html += formField('Description', 'editDesc', currentApi.description || '', 'textarea');
    html += formField('Path', 'editPath', currentApi.path || '');
    html += formSelect('HTTP Method', 'editMethod', ['GET','POST','PUT','DELETE','PATCH'], currentApi.httpMethod);

    // Response example
    html += formField('Response Example', 'editRespExample', currentApi.response?.example || '', 'textarea');

    // Request body example
    html += formField('Request Body Example', 'editReqExample', currentApi.requestBody?.example || '', 'textarea');

    // Tags
    html += formField('Tags (comma separated)', 'editTags', (currentApi.tags || []).join(', '));

    body.innerHTML = html;
    document.getElementById('editModalSave').onclick = saveEditApi;
    modal.classList.add('open');
}

function openEditEntity() {
    if (!currentEntity) return;
    const modal = document.getElementById('editModal');
    const body = document.getElementById('editModalBody');
    document.getElementById('editModalTitle').textContent = 'Edit Entity: ' + currentEntity.name;

    let html = '';
    html += formField('Description', 'editEntDesc', currentEntity.description || '', 'textarea');

    // Fields
    if (currentEntity.fields && currentEntity.fields.length) {
        html += '<div class="form-group"><label>Fields</label>';
        html += '<table class="kv-table"><thead><tr><th>Name</th><th>Description</th><th>Example</th></tr></thead><tbody id="entityFieldsBody">';
        currentEntity.fields.forEach((f, i) => {
            html += `<tr data-idx="${i}"><td><input value="${esc(f.name)}" disabled style="opacity:.6"></td><td><input value="${esc(f.description || '')}" class="ef-desc"></td><td><input value="${esc(f.example || '')}" class="ef-example"></td></tr>`;
        });
        html += '</tbody></table></div>';
    }

    body.innerHTML = html;
    document.getElementById('editModalSave').onclick = saveEditEntity;
    modal.classList.add('open');
}

async function saveEditApi() {
    if (!currentApi) return;
    currentApi.name = document.getElementById('editName').value;
    currentApi.description = document.getElementById('editDesc').value;
    currentApi.path = document.getElementById('editPath').value;
    currentApi.httpMethod = document.getElementById('editMethod').value;
    currentApi.tags = document.getElementById('editTags').value.split(',').map(s => s.trim()).filter(Boolean);

    const respExample = document.getElementById('editRespExample').value;
    if (currentApi.response) currentApi.response.example = respExample;

    const reqExample = document.getElementById('editReqExample').value;
    if (currentApi.requestBody) currentApi.requestBody.example = reqExample;

    try {
        const res = await fetch(API + '/endpoints/' + encodeURIComponent(currentApi.methodSignature), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentApi)
        });
        if (res.ok) {
            currentApi = await res.json();
            closeEditModal();
            renderContent();
            showToast('API updated');
            await loadAllApis();
            await loadTree();
        }
    } catch (e) { showToast('Failed: ' + e.message); }
}

async function saveEditEntity() {
    if (!currentEntity) return;
    currentEntity.description = document.getElementById('editEntDesc').value;

    // Update fields
    document.querySelectorAll('#entityFieldsBody tr').forEach(tr => {
        const idx = parseInt(tr.dataset.idx);
        if (currentEntity.fields[idx]) {
            currentEntity.fields[idx].description = tr.querySelector('.ef-desc').value;
            currentEntity.fields[idx].example = tr.querySelector('.ef-example').value;
        }
    });

    try {
        const res = await fetch(API + '/entities/' + encodeURIComponent(currentEntity.fullName), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentEntity)
        });
        if (res.ok) {
            currentEntity = await res.json();
            closeEditModal();
            renderContent();
            showToast('Entity updated');
            await loadAllEntities();
        }
    } catch (e) { showToast('Failed: ' + e.message); }
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
}

function formField(label, id, value, type) {
    if (type === 'textarea') {
        return `<div class="form-group"><label>${esc(label)}</label><textarea id="${id}" rows="4">${esc(value)}</textarea></div>`;
    }
    return `<div class="form-group"><label>${esc(label)}</label><input id="${id}" value="${esc(value)}"></div>`;
}

function formSelect(label, id, options, selected) {
    let html = `<div class="form-group"><label>${esc(label)}</label><select id="${id}">`;
    options.forEach(o => html += `<option ${o===selected?'selected':''}>${o}</option>`);
    html += '</select></div>';
    return html;
}

// ==================== Actions ====================
async function rescan() {
    setAppStatus('Rescanning source...');
    showToast('Rescanning...');
    try {
        const res = await fetch(API + '/rescan', { method: 'POST' });
        if (res.ok) {
            const result = await res.json();
            showToast(`Scan complete: ${result.controllers} controllers, ${result.newApis} new APIs (${result.elapsedMs}ms)`);
            await loadTree();
            await loadAllApis();
            await loadAllEntities();
            filterNavigator();
            updateStats();
            setAppStatus('Source index ready');
        }
    } catch (e) {
        setAppStatus('Rescan failed');
        showToast('Failed: ' + e.message);
    }
}

async function loadEntities() {
    await loadAllEntities();
    if (allEntities.length === 0) {
        showToast('No entities found');
        return;
    }
    switchNavigator('entities');
}

// ==================== Utils ====================
function esc(s) {
    if (!s) return '';
    const el = document.createElement('span');
    el.textContent = s;
    return el.innerHTML;
}

function syntaxHighlight(json) {
    if (!json) return '';
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
        let cls = 'color:#059669'; // number
        if (/^"/.test(match)) {
            if (/:$/.test(match)) cls = 'color:#2563eb'; // key
            else cls = 'color:#b45309'; // string
        } else if (/true|false/.test(match)) cls = 'color:#dc2626'; // boolean
        else if (/null/.test(match)) cls = 'color:#6b7280'; // null
        return '<span style="' + cls + '">' + match + '</span>';
    });
}

function copyCode(btn) {
    const code = btn.parentElement.textContent.replace('Copy', '').trim();
    navigator.clipboard.writeText(code);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
}

function copyText(value) {
    navigator.clipboard.writeText(value || '');
    showToast('Copied to clipboard');
}

function copyCurrentPath() {
    if (currentApi) copyText(currentApi.path);
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

function toggleTheme() {
    const html = document.documentElement;
    const nextTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.classList.add('theme-transition');
    html.setAttribute('data-theme', nextTheme);
    localStorage.setItem('marginalia-theme', nextTheme);
    updateThemeToggle();
    setTimeout(() => html.classList.remove('theme-transition'), 320);
}

function initTheme() {
    const savedTheme = localStorage.getItem('marginalia-theme');
    document.documentElement.setAttribute('data-theme', savedTheme || 'dark');
    updateThemeToggle();
}

function updateThemeToggle() {
    const btn = document.getElementById('themeToggle');
    if (!btn) return;
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.innerHTML = iconSvg(dark ? 'sun' : 'moon');
    btn.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
}

// Click outside modal to close
document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
});
document.getElementById('commandPalette').addEventListener('click', function(e) {
    if (e.target === this) closeCommandPalette();
});
document.getElementById('commandInput').addEventListener('input', function() {
    commandIndex = 0;
    renderCommandResults();
});
document.getElementById('commandInput').addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        commandIndex = Math.min(commandItems.length - 1, commandIndex + 1);
        renderCommandResults();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        commandIndex = Math.max(0, commandIndex - 1);
        renderCommandResults();
    } else if (e.key === 'Enter') {
        e.preventDefault();
        activateCommand(commandIndex);
    }
});

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openCommandPalette();
        return;
    }
    if (e.key === 'Escape') {
        closeEditModal();
        closeCommandPalette();
        closeMobileSidebar();
    }
    if (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
    }
});

// Init
initTheme();
init();
</script>
