<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginalia API Documentation</title>
<style>
:root {
    --bg: #ffffff; --bg2: #f8f9fa; --bg3: #e9ecef; --bg4: #dee2e6;
    --fg: #212529; --fg2: #495057; --fg3: #868e96;
    --border: #dee2e6; --accent: #2563eb; --accent2: #1d4ed8;
    --green: #16a34a; --red: #dc2626; --orange: #ea580c; --purple: #7c3aed;
    --method-fg: #ffffff;
    --code-bg: #f1f3f5; --shadow: rgba(0,0,0,.08);
    --radius: 6px; --sidebar-w: 280px;
}
[data-theme="dark"] {
    --bg: #1a1b1e; --bg2: #25262b; --bg3: #2c2e33; --bg4: #373a40;
    --fg: #c1c2c5; --fg2: #909296; --fg3: #5c5f66;
    --method-fg: #f8fafc;
    --border: #373a40; --code-bg: #2c2e33; --shadow: rgba(0,0,0,.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--fg); display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
button { cursor: pointer; font-family: inherit; font-size: 13px; }
input, textarea, select { font-family: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
textarea { resize: vertical; }

/* Sidebar */
.sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
.sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.sidebar-header h1 { font-size: 16px; font-weight: 700; flex: 1; }
.sidebar-header .version { font-size: 11px; color: var(--fg3); background: var(--bg3); padding: 2px 6px; border-radius: 10px; }
.sidebar-search { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.sidebar-search input { width: 100%; }
.sidebar-tree { flex: 1; overflow-y: auto; padding: 8px 0; }
.tree-item { display: flex; align-items: center; padding: 5px 12px; cursor: pointer; user-select: none; gap: 6px; font-size: 13px; color: var(--fg2); transition: background .15s; flex-wrap: nowrap; min-height: 28px; }
.tree-item:hover { background: var(--bg3); }
.tree-item.active { background: var(--accent); color: #fff; border-radius: var(--radius); margin: 0 4px; padding: 5px 8px; }
.tree-item .icon { width: 18px; text-align: center; font-size: 12px; flex-shrink: 0; }
.tree-item .arrow { width: 14px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; color: var(--fg3); transition: color .15s; }
.tree-item .arrow::before { content: ""; width: 6px; height: 6px; border-right: 1.8px solid currentColor; border-bottom: 1.8px solid currentColor; transform: rotate(-45deg); transition: transform .18s ease; }
.tree-item:hover .arrow { color: var(--fg2); }
.tree-item.active .arrow { color: rgba(255,255,255,.85); }
.tree-item .arrow.open::before { transform: rotate(45deg); }
.tree-children { display: none; }
.tree-children.open { display: block; }
.method-badge { min-width: 42px; text-align: center; font-size: 10px; line-height: 1.35; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: var(--method-fg); background: var(--bg4); flex-shrink: 0; display: inline-block; letter-spacing: 0; }
.method-badge.method-GET { background: var(--green); } .method-badge.method-POST { background: #2563eb; } .method-badge.method-PUT { background: var(--orange); } .method-badge.method-DELETE { background: var(--red); } .method-badge.method-PATCH { background: var(--purple); }

/* Sidebar Footer */
.sidebar-footer { padding: 8px 12px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
.sidebar-footer button { flex: 1; padding: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg2); border-radius: var(--radius); }
.sidebar-footer button:hover { background: var(--bg3); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.toolbar { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--bg2); }
.toolbar .mode-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.toolbar .mode-toggle button { padding: 6px 14px; border: none; background: var(--bg); color: var(--fg2); }
.toolbar .mode-toggle button.active { background: var(--accent); color: #fff; }
.toolbar .title { flex: 1; font-weight: 600; font-size: 15px; }

.content { flex: 1; overflow-y: auto; padding: 0; }

/* Doc Mode */
.doc-view { max-width: 960px; margin: 0 auto; padding: 24px; }
.doc-endpoint-header { margin-bottom: 24px; }
.doc-endpoint-header .path-line { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.doc-endpoint-header .method-badge-lg { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius); color: #fff; }
.doc-endpoint-header .path-text { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 15px; font-weight: 600; color: var(--fg); word-break: break-all; }
.doc-endpoint-header .name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.doc-endpoint-header .desc { color: var(--fg2); line-height: 1.6; }
.doc-section { margin-bottom: 20px; }
.doc-section h3 { font-size: 14px; font-weight: 600; color: var(--fg3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.doc-table { width: 100%; border-collapse: collapse; }
.doc-table th { text-align: left; padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--fg3); background: var(--bg2); border-bottom: 2px solid var(--border); }
.doc-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.doc-table .param-name { font-family: 'SF Mono', 'Fira Code', monospace; font-weight: 600; color: var(--accent); }
.doc-table .param-type { font-family: 'SF Mono', 'Fira Code', monospace; color: var(--purple); font-size: 12px; }
.doc-table .required { color: var(--red); font-size: 11px; font-weight: 600; }
.doc-table .optional { color: var(--fg3); font-size: 11px; }
.code-block { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; overflow-x: auto; max-height: 400px; overflow-y: auto; position: relative; }
.code-block .copy-btn { position: absolute; top: 8px; right: 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 11px; color: var(--fg2); cursor: pointer; }
.code-block .copy-btn:hover { background: var(--bg4); }
.entity-link { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.entity-link:hover { color: var(--accent2); }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg3); color: var(--fg2); margin-right: 4px; }
.badge-sse { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #f59e0b; color: #fff; }
.badge-deprecated { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--red); color: #fff; }
.empty-state { text-align: center; padding: 80px 20px; color: var(--fg3); flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.empty-state h2 { font-size: 18px; margin-bottom: 8px; color: var(--fg2); }

/* Debug Mode */
.debug-view { display: flex; flex-direction: column; height: 100%; }
.debug-request { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); }
.debug-url-bar { display: flex; gap: 8px; margin-bottom: 8px; }
.debug-url-bar select { width: 100px; font-weight: 700; }
.debug-url-bar input { flex: 1; font-family: 'SF Mono', 'Fira Code', monospace; }
.debug-url-bar button { padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-weight: 600; }
.debug-url-bar button:hover { background: var(--accent2); }
.debug-url-bar button.sse-btn { background: #f59e0b; }
.debug-url-bar button.sse-btn:hover { background: #d97706; }
.debug-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); }
.debug-tabs button { padding: 8px 16px; border: none; background: transparent; color: var(--fg2); border-bottom: 2px solid transparent; }
.debug-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.debug-tab-content { flex: 1; overflow-y: auto; padding: 12px 16px; }
.kv-table { width: 100%; }
.kv-table th { text-align: left; padding: 4px 8px; font-size: 12px; color: var(--fg3); }
.kv-table td { padding: 4px 8px; }
.kv-table input { width: 100%; }
.kv-table .del-btn { background: none; border: none; color: var(--red); font-size: 16px; padding: 2px 6px; }
.add-row-btn { margin-top: 8px; padding: 4px 12px; border: 1px dashed var(--border); background: transparent; color: var(--fg3); border-radius: var(--radius); }
.add-row-btn:hover { border-color: var(--accent); color: var(--accent); }
.debug-response { border-top: 2px solid var(--border); min-height: 200px; display: flex; flex-direction: column; }
.debug-response-header { padding: 8px 16px; display: flex; align-items: center; gap: 12px; background: var(--bg2); border-bottom: 1px solid var(--border); font-size: 13px; }
.debug-response-header .status { font-weight: 700; }
.debug-response-header .status.ok { color: var(--green); } .debug-response-header .status.err { color: var(--red); }
.debug-response-body { flex: 1; overflow: auto; padding: 12px 16px; }
.debug-response-body pre { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
.sse-events { padding: 12px 16px; flex: 1; overflow-y: auto; }
.sse-event { padding: 8px 12px; margin-bottom: 4px; background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }

/* Edit Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg); border-radius: 8px; width: 90%; max-width: 700px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px var(--shadow); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
.modal-header h2 { flex: 1; font-size: 16px; }
.modal-header button { background: none; border: none; font-size: 20px; color: var(--fg3); padding: 4px 8px; }
.modal-body { flex: 1; overflow-y: auto; padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.modal-footer button { padding: 8px 20px; border-radius: var(--radius); }
.btn-primary { background: var(--accent); color: #fff; border: none; } .btn-primary:hover { background: var(--accent2); }
.btn-secondary { background: var(--bg); color: var(--fg2); border: 1px solid var(--border); } .btn-secondary:hover { background: var(--bg3); }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--fg3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg3); }

/* Toast */
.toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background: var(--green); color: #fff; border-radius: var(--radius); font-size: 13px; z-index: 2000; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.toast.show { display: block; animation: fadeInUp .3s ease; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h1>Marginalia</h1>
        <button id="themeToggle" onclick="toggleTheme()" title="Toggle theme" style="background:none;border:none;color:var(--fg2);font-size:16px;padding:4px;">◐</button>
    </div>
    <div class="sidebar-search">
        <input type="text" placeholder="Search APIs..." id="searchInput" oninput="filterTree()">
    </div>
    <div class="sidebar-tree" id="treeContainer"></div>
    <div class="sidebar-footer">
        <button onclick="rescan()" title="Re-scan source code">↻ Rescan</button>
        <button onclick="loadEntities()" title="View entities">☰ Entities</button>
    </div>
</div>

<div class="main">
    <div class="toolbar">
        <div class="mode-toggle">
            <button class="active" id="btnDocMode" onclick="setMode('doc')">Document</button>
            <button id="btnDebugMode" onclick="setMode('debug')">Debug</button>
        </div>
        <div class="title" id="toolbarTitle">Marginalia API Documentation</div>
    </div>
    <div class="empty-state" id="emptyState">
        <h2>Welcome to Marginalia</h2>
        <p>Select an API from the sidebar to view its documentation.</p>
    </div>
    <div class="content" id="contentArea" style="display:none"></div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="editModalTitle">Edit</h2>
            <button onclick="closeEditModal()">&times;</button>
        </div>
        <div class="modal-body" id="editModalBody"></div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
            <button class="btn-primary" id="editModalSave">Save</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PREFIX = location.pathname.replace(/\/+$/, '');
const API = PREFIX + '/api';
let currentMode = 'doc';
let currentApi = null;
let currentEntity = null;
let currentControllerClass = null;
let treeData = [];
let allApis = [];
let allEntities = [];
let sseSource = null;
let openTreeKeys = new Set();
let applyingUrlState = false;

// ==================== Init ====================
async function init() {
    await loadTree();
    await loadAllApis();
    await loadAllEntities();
    applyUrlState();
}

async function loadTree() {
    try {
        const res = await fetch(API + '/tree');
        if (res.ok) treeData = await res.json();
    } catch (e) { console.error('Failed to load tree', e); }
    renderTree(treeData);
    restoreTreeSelection();
}

async function loadAllApis() {
    try {
        const res = await fetch(API + '/endpoints');
        if (res.ok) allApis = await res.json();
    } catch (e) { console.error('Failed to load APIs', e); }
}

async function loadAllEntities() {
    try {
        const res = await fetch(API + '/entities');
        if (res.ok) allEntities = await res.json();
    } catch (e) { console.error('Failed to load entities', e); }
}

// ==================== Tree ====================
function renderTree(data) {
    const container = document.getElementById('treeContainer');
    container.innerHTML = '';
    data.forEach(node => container.appendChild(createTreeNode(node, 0, '')));
}

function createTreeNode(node, depth, parentKey) {
    const nodeKey = getTreeNodeKey(node, parentKey);
    const wrapper = document.createElement('div');
    const item = document.createElement('div');
    item.className = 'tree-item';
    item.style.paddingLeft = (12 + depth * 16) + 'px';
    item.dataset.treeKey = nodeKey;
    item.dataset.nodeType = node.type || '';
    if (node.id) item.dataset.nodeId = node.id;

    const hasChildren = node.children && node.children.length > 0;
    const childrenDiv = hasChildren ? document.createElement('div') : null;
    if (childrenDiv) {
        childrenDiv.className = 'tree-children';
        node.children.forEach(child => childrenDiv.appendChild(createTreeNode(child, depth + 1, nodeKey)));
    }

    // Arrow: visible for items with children, hidden spacer for leaf nodes
    if (hasChildren) {
        const arrow = document.createElement('span');
        arrow.className = 'arrow';
        if (openTreeKeys.has(nodeKey)) arrow.classList.add('open');
        item.appendChild(arrow);
    } else {
        const spacer = document.createElement('span');
        spacer.className = 'arrow';
        spacer.style.visibility = 'hidden';
        item.appendChild(spacer);
    }

    // Icon or method badge
    if (node.type === 'api' && node.icon) {
        const method = normalizeHttpMethod(node.icon);
        const badge = document.createElement('span');
        badge.className = 'method-badge method-' + method;
        badge.textContent = method;
        item.appendChild(badge);
    } else if (node.type === 'directory') {
        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = '📁';
        item.appendChild(icon);
    }

    const label = document.createElement('span');
    label.textContent = node.name;
    label.style.flex = '1';
    label.style.overflow = 'hidden';
    label.style.textOverflow = 'ellipsis';
    label.style.whiteSpace = 'nowrap';
    item.appendChild(label);

    // Click anywhere on the item to toggle/select
    item.onclick = () => {
        if (node.type === 'api') {
            selectApi(node.id);
        } else if (node.type === 'controller') {
            if (childrenDiv) {
                toggleTreeNode(nodeKey, item, childrenDiv);
            }
            selectController(node.id);
        } else if (node.type === 'directory' && childrenDiv) {
            toggleTreeNode(nodeKey, item, childrenDiv);
        }
    };

    wrapper.appendChild(item);
    if (childrenDiv) {
        if (openTreeKeys.has(nodeKey)) childrenDiv.classList.add('open');
        wrapper.appendChild(childrenDiv);
    }

    return wrapper;
}

function getTreeNodeKey(node, parentKey) {
    const rawId = node.id || node.name || 'node';
    const segment = (node.type || 'node') + ':' + rawId;
    return parentKey ? parentKey + '/' + segment : segment;
}

function toggleTreeNode(nodeKey, item, childrenDiv) {
    const arrow = item.querySelector('.arrow');
    const willOpen = !childrenDiv.classList.contains('open');
    if (arrow) arrow.classList.toggle('open', willOpen);
    childrenDiv.classList.toggle('open', willOpen);
    if (willOpen) openTreeKeys.add(nodeKey);
    else openTreeKeys.delete(nodeKey);
    updateUrlState();
}

function filterTree() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.tree-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        const parent = item.parentElement;
        if (q === '' || text.includes(q)) {
            item.style.display = '';
        } else {
            item.style.display = 'none';
        }
    });
    if (q) {
        document.querySelectorAll('.tree-children').forEach(c => c.classList.add('open'));
        document.querySelectorAll('.arrow').forEach(a => a.classList.add('open'));
    }
}

function normalizeHttpMethod(method) {
    return (method || '').toString().trim().toUpperCase();
}

// ==================== Mode ====================
function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnDocMode').classList.toggle('active', mode === 'doc');
    document.getElementById('btnDebugMode').classList.toggle('active', mode === 'debug');
    if (currentApi) renderContent();
    updateUrlState();
}

// ==================== Select ====================
function selectApi(signature) {
    currentApi = allApis.find(a => a.methodSignature === signature);
    currentEntity = null;
    currentControllerClass = null;
    if (!currentApi) return;

    // Open parent nodes in tree
    setActiveTreeItem('api', signature);

    document.getElementById('toolbarTitle').textContent = currentApi.name || currentApi.path;
    renderContent();
    updateUrlState();
}

function selectController(className) {
    currentApi = null;
    currentEntity = null;
    currentControllerClass = className;
    const apis = allApis.filter(a => a.controllerClass === className);
    setActiveTreeItem('controller', className);
    document.getElementById('toolbarTitle').textContent = className.split('.').pop();
    renderControllerView(apis, className);
    updateUrlState();
}

function selectEntity(fullName) {
    currentEntity = allEntities.find(e => e.fullName === fullName);
    currentApi = null;
    currentControllerClass = null;
    if (!currentEntity) return;
    clearActiveTreeItem();
    document.getElementById('toolbarTitle').textContent = currentEntity.name;
    renderContent();
    updateUrlState();
}

function clearActiveTreeItem() {
    document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
}

function setActiveTreeItem(type, id) {
    clearActiveTreeItem();
    let activeItem = null;
    document.querySelectorAll('.tree-item').forEach(el => {
        if (el.dataset.nodeType === type && el.dataset.nodeId === id) {
            activeItem = el;
            el.classList.add('active');
        }
    });
    if (activeItem) revealTreeItem(activeItem);
}

function restoreTreeSelection() {
    if (currentApi) setActiveTreeItem('api', currentApi.methodSignature);
    else if (currentControllerClass) setActiveTreeItem('controller', currentControllerClass);
    else clearActiveTreeItem();
}

function revealTreeItem(item) {
    let parent = item.parentElement;
    while (parent) {
        if (parent.classList && parent.classList.contains('tree-children')) {
            parent.classList.add('open');
            const parentItem = parent.previousElementSibling;
            if (parentItem) {
                const arrow = parentItem.querySelector('.arrow');
                if (arrow) arrow.classList.add('open');
                if (parentItem.dataset.treeKey) openTreeKeys.add(parentItem.dataset.treeKey);
            }
        }
        parent = parent.parentElement;
    }
}

// ==================== Render ====================
function renderContent() {
    const area = document.getElementById('contentArea');
    const empty = document.getElementById('emptyState');
    if (currentApi) {
        empty.style.display = 'none';
        area.style.display = '';
        if (currentMode === 'doc') renderDocView(area, currentApi);
        else renderDebugView(area, currentApi);
    } else if (currentEntity) {
        empty.style.display = 'none';
        area.style.display = '';
        renderEntityView(area, currentEntity);
    } else if (currentControllerClass) {
        empty.style.display = 'none';
        area.style.display = '';
        const apis = allApis.filter(a => a.controllerClass === currentControllerClass);
        renderControllerView(apis, currentControllerClass);
    } else {
        empty.style.display = '';
        area.style.display = 'none';
    }
}

function getCurrentSelectionState() {
    if (currentApi) return { type: 'api', id: currentApi.methodSignature };
    if (currentEntity) return { type: 'entity', id: currentEntity.fullName };
    if (currentControllerClass) return { type: 'controller', id: currentControllerClass };
    return { type: '', id: '' };
}

function updateUrlState() {
    if (applyingUrlState) return;

    const params = new URLSearchParams(location.search);
    params.set('mode', currentMode);

    const selection = getCurrentSelectionState();
    if (selection.type && selection.id) {
        params.set('type', selection.type);
        params.set('id', selection.id);
    } else {
        params.delete('type');
        params.delete('id');
    }

    if (openTreeKeys.size) {
        params.set('open', Array.from(openTreeKeys).join('|'));
    } else {
        params.delete('open');
    }

    const query = params.toString();
    const nextUrl = location.pathname + (query ? '?' + query : '') + location.hash;
    history.replaceState(null, '', nextUrl);
}

function applyUrlState() {
    applyingUrlState = true;
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode');
    const type = params.get('type');
    const id = params.get('id');
    const open = params.get('open');

    openTreeKeys = new Set(open ? open.split('|').filter(Boolean) : []);
    renderTree(treeData);

    if (mode === 'debug' || mode === 'doc') {
        currentMode = mode;
        document.getElementById('btnDocMode').classList.toggle('active', mode === 'doc');
        document.getElementById('btnDebugMode').classList.toggle('active', mode === 'debug');
    }

    applyingUrlState = false;

    if (type === 'api' && id && allApis.some(a => a.methodSignature === id)) {
        selectApi(id);
    } else if (type === 'controller' && id) {
        const hasController = treeData.some(node => treeContainsNode(node, 'controller', id));
        if (hasController) selectController(id);
        else updateUrlState();
    } else if (type === 'entity' && id && allEntities.some(e => e.fullName === id)) {
        selectEntity(id);
    } else {
        renderContent();
        updateUrlState();
    }
}

function treeContainsNode(node, type, id) {
    if (node.type === type && node.id === id) return true;
    return !!(node.children && node.children.some(child => treeContainsNode(child, type, id)));
}

/**
 * 从类型字符串中解析实体引用，支持嵌套泛型如 R<List<User>>
 * 优先匹配最内层类型
 */
function resolveEntityRef(type) {
    if (!type) return null;
    // 直接匹配
    let entity = allEntities.find(e => e.fullName === type || e.name === type);
    if (entity) return entity.fullName;
    // 提取所有类名（从泛型中），反转使得最内层优先
    const names = [];
    let depth = 0, buf = '';
    for (const ch of type) {
        if (ch === '<') { depth++; if (buf.trim()) names.push(buf.trim()); buf = ''; }
        else if (ch === '>') { if (buf.trim()) names.push(buf.trim()); buf = ''; depth--; }
        else if (ch === ',' || ch === ' ') { if (depth > 0 && buf.trim()) { names.push(buf.trim()); buf = ''; } }
        else if (depth > 0) { buf += ch; }
    }
    if (buf.trim()) names.push(buf.trim());
    // 从后往前找（最内层优先）
    for (let i = names.length - 1; i >= 0; i--) {
        const n = names[i];
        if (/^[A-Z]/.test(n)) {
            entity = allEntities.find(e => e.name === n || e.fullName.endsWith('.' + n));
            if (entity) return entity.fullName;
        }
    }
    return null;
}

    html += '</div>';

    entity.fields.forEach(f => {

}

function renderDebugView(area, api) {
    if (sseSource) { sseSource.close(); sseSource = null; }

    let html = '<div class="debug-view">';

    // URL bar
    html += '<div class="debug-request">';
    html += '<div class="debug-url-bar">';
    const debugMethod = api.debugMethod || api.httpMethod;
    html += `<select id="debugMethod"><option ${debugMethod==='GET'?'selected':''}>GET</option><option ${debugMethod==='POST'?'selected':''}>POST</option><option ${debugMethod==='PUT'?'selected':''}>PUT</option><option ${debugMethod==='DELETE'?'selected':''}>DELETE</option><option ${debugMethod==='PATCH'?'selected':''}>PATCH</option></select>`;
    const origin = location.origin;
    const debugUrl = api.debugUrl || (origin + api.path);
    html += `<input type="text" id="debugUrl" value="${esc(debugUrl)}">`;
    html += '<button onclick="sendRequest()">Send</button>';
    if (api.sse) html += '<button class="sse-btn" onclick="connectSSE()">SSE</button>';
    html += '</div></div>';

    // Tabs
    html += '<div class="debug-tabs">';
    html += '<button class="active" onclick="switchDebugTab(this,\'paramsTab\')">Params</button>';
    html += '<button onclick="switchDebugTab(this,\'headersTab\')">Headers</button>';
    html += '<button onclick="switchDebugTab(this,\'bodyTab\')">Body</button>';
    html += '</div>';

    // Build persisted params map (debug params override API params)
    const persistedParams = api.debugParams || {};
    const persistedParamDescs = api.debugParamDescs || {};
    // Merge: start with API queryParams, then overlay debug params
    const mergedParams = {};
    if (api.queryParams) api.queryParams.forEach(p => {
        const val = persistedParams.hasOwnProperty(p.name) ? persistedParams[p.name] : (p.defaultValue || p.example || '');
        const desc = persistedParamDescs.hasOwnProperty(p.name) ? persistedParamDescs[p.name] : (p.description || '');
        mergedParams[p.name] = { value: val, description: desc };
    });
    Object.keys(persistedParams).forEach(k => {
        if (!mergedParams[k]) mergedParams[k] = { value: persistedParams[k], description: persistedParamDescs[k] || '' };
    });

    // Params tab
    html += '<div class="debug-tab-content" id="paramsTab">';
    html += '<table class="kv-table" id="paramsTable"><thead><tr><th style="width:25%">Key</th><th style="width:30%">Value</th><th style="width:35%">Description</th><th style="width:10%"></th></tr></thead><tbody>';
    Object.entries(mergedParams).forEach(([name, info]) => {
        html += `<tr><td><input value="${esc(name)}" class="kv-key"></td><td><input value="${esc(info.value)}" class="kv-val"></td><td><input value="${esc(info.description)}" class="kv-desc" placeholder="description"></td><td><button class="del-btn" onclick="this.closest('tr').remove()">&times;</button></td></tr>`;
    });
    html += '</tbody></table>';
    html += '<button class="add-row-btn" onclick="addDebugKvRow(\'paramsTable\')">+ Add Parameter</button>';
    html += '</div>';

    // Build persisted headers map
    const persistedHeaders = api.debugHeaders || {};
    const persistedHeaderDescs = api.debugHeaderDescs || {};
    // Default: Content-Type if no persisted headers
    const mergedHeaders = {};
    if (Object.keys(persistedHeaders).length > 0) {
        Object.entries(persistedHeaders).forEach(([k, v]) => {
            mergedHeaders[k] = { value: v, description: persistedHeaderDescs[k] || '' };
        });
    } else {
        mergedHeaders['Content-Type'] = { value: 'application/json', description: '' };
    }

    // Headers tab
    html += '<div class="debug-tab-content" id="headersTab" style="display:none">';
    html += '<table class="kv-table" id="headersTable"><thead><tr><th style="width:25%">Key</th><th style="width:30%">Value</th><th style="width:35%">Description</th><th style="width:10%"></th></tr></thead><tbody>';
    Object.entries(mergedHeaders).forEach(([name, info]) => {
        html += `<tr><td><input value="${esc(name)}" class="kv-key"></td><td><input value="${esc(info.value)}" class="kv-val"></td><td><input value="${esc(info.description)}" class="kv-desc" placeholder="description"></td><td><button class="del-btn" onclick="this.closest('tr').remove()">&times;</button></td></tr>`;
    });
    html += '</tbody></table>';
    html += '<button class="add-row-btn" onclick="addDebugKvRow(\'headersTable\')">+ Add Header</button>';
    html += '</div>';

    // Body tab - field-level editor with JSON toggle
    html += '<div class="debug-tab-content" id="bodyTab" style="display:none">';
    html += '<div class="debug-body-tabs" style="display:flex;gap:8px;margin-bottom:8px;">';
    html += '<button class="btn-secondary active" id="bodyFieldTabBtn" onclick="switchBodyTab(\'field\')" style="padding:4px 12px;font-size:12px;">Fields</button>';
    html += '<button class="btn-secondary" id="bodyJsonTabBtn" onclick="switchBodyTab(\'json\')" style="padding:4px 12px;font-size:12px;">JSON</button>';
    html += '</div>';

    // Field-level editor
    html += '<div id="bodyFieldEditor">';
    const debugBody = api.debugBody || '';
    const reqEntityRef = api.requestBody ? (api.requestBody.entityRef || resolveEntityRef(api.requestBody.type)) : null;
    const entityForBody = reqEntityRef ? allEntities.find(e => e.fullName === reqEntityRef) : null;
    let bodyObj = null;
    if (debugBody) {
        try { bodyObj = JSON.parse(debugBody); } catch(e) { bodyObj = null; }
    }
    if (entityForBody && entityForBody.fields && entityForBody.fields.length > 0) {
        // Generate from entity fields
        if (!bodyObj) bodyObj = generateJsonFromEntity(entityForBody);
        html += '<table class="kv-table" id="bodyFieldsTable"><thead><tr><th style="width:20%">Field</th><th style="width:15%">Type</th><th style="width:30%">Value</th><th style="width:25%">Description</th><th style="width:10%"></th></tr></thead><tbody>';
        entityForBody.fields.forEach(f => {
            const val = bodyObj && bodyObj.hasOwnProperty(f.name) ? JSON.stringify(bodyObj[f.name]) : (f.example ? f.example : getDefaultValue(f.type));
            html += `<tr data-field="${esc(f.name)}" data-type="${esc(f.type)}">`;
            html += `<td><span class="param-name" style="font-size:12px;">${esc(f.name)}</span></td>`;
            html += `<td><span class="param-type" style="font-size:11px;">${esc(f.type)}</span></td>`;
            html += `<td><input value="${esc(val.replace(/^"|"$/g, ''))}" class="body-field-val"></td>`;
            html += `<td><span style="font-size:11px;color:var(--fg2);">${esc(f.description || '')}</span></td>`;
            html += `<td></td></tr>`;
        });
        html += '</tbody></table>';
    } else {
        // No entity - show raw textarea
        html += '<textarea id="debugBody" rows="8" style="width:100%;font-family:monospace;" placeholder="Request body (JSON)">';
        html += esc(debugBody || (api.requestBody ? '{}' : ''));
        html += '</textarea>';
    }
    html += '</div>';

    // Raw JSON editor (hidden by default)
    html += '<div id="bodyJsonEditor" style="display:none">';
    html += '<textarea id="debugBodyJson" rows="8" style="width:100%;font-family:monospace;" placeholder="Request body (JSON)">';
    html += esc(debugBody || (api.requestBody ? '{}' : ''));
    html += '</textarea>';
    html += '</div>';
    html += '</div>';

    // Response area
    html += '<div class="debug-response" id="debugResponse">';
    html += '<div class="debug-response-header" id="debugResponseHeader" style="display:none">';
    html += '<span>Status: <span class="status" id="debugStatus"></span></span>';
    html += '<span id="debugTime" style="color:var(--fg3)"></span>';
    html += '<button class="btn-secondary" style="margin-left:auto;padding:3px 10px;font-size:12px;" onclick="updateExample()" id="updateExampleBtn" style="display:none">Use as Example</button>';
    html += '</div>';
    html += '<div class="debug-response-body"><pre id="debugResponseBody">Response will appear here...</pre></div>';
    html += '<div class="sse-events" id="sseEvents" style="display:none"></div>';
    html += '</div>';

    html += '</div>';
    area.innerHTML = html;

    // Restore persisted response if available
    if (api.debugResponse) {
        const header = document.getElementById('debugResponseHeader');
        const status = document.getElementById('debugStatus');
        const body = document.getElementById('debugResponseBody');
        header.style.display = '';
        status.textContent = 'cached';
        status.className = 'status ok';
        try { body.innerHTML = syntaxHighlight(api.debugResponse); } catch(e) { body.textContent = api.debugResponse; }
        document.getElementById('updateExampleBtn').style.display = '';
    }
}

    const tbody = document.querySelector('#' + tableId + ' tbody');

    tr.innerHTML = '<td><input class="kv-key"></td><td><input class="kv-val"></td><td><input class="kv-desc" placeholder="description"></td><td><button class="del-btn" onclick="this.closest(\'tr\').remove()">&times;</button></td>';

function getKvPairs(tableId) {
    const pairs = {};
    document.querySelectorAll('#' + tableId + ' tbody tr').forEach(tr => {
        const key = tr.querySelector('.kv-key')?.value?.trim();
        const val = tr.querySelector('.kv-val')?.value?.trim();
        if (key) pairs[key] = val || '';
    });
    return pairs;
}

function getDebugKvPairsWithDesc(tableId) {
    const pairs = {};
    const descs = {};
    document.querySelectorAll('#' + tableId + ' tbody tr').forEach(tr => {
        const key = tr.querySelector('.kv-key')?.value?.trim();
        const val = tr.querySelector('.kv-val')?.value?.trim();
        const desc = tr.querySelector('.kv-desc')?.value?.trim();
        if (key) {
            pairs[key] = val || '';
            if (desc) descs[key] = desc;
        }
    });
    return { pairs, descs };
}

function generateJsonFromEntity(entity) {
    if (!entity || !entity.fields) return {};
    const obj = {};
    entity.fields.forEach(f => {
        if (f.example) {
            try { obj[f.name] = JSON.parse(f.example); } catch(e) { obj[f.name] = f.example; }
        } else {
            obj[f.name] = getDefaultValue(f.type);
        }
    });
    return obj;
}

function getDefaultValue(type) {
    if (!type) return '';
    const t = type.toLowerCase();
    if (t === 'int' || t === 'integer' || t === 'long' || t === 'double' || t === 'float' || t === 'short' || t === 'byte') return 0;
    if (t === 'boolean') return false;
    if (t === 'string') return '';
    if (t.startsWith('list') || t.startsWith('array')) return [];
    if (t.startsWith('map') || t.startsWith('object')) return {};
    return '';
}

    const jsonEditor = document.getElementById('bodyJsonEditor');
    if (tab === 'field') {
        fieldBtn.classList.add('active');
        jsonBtn.classList.remove('active');
        fieldEditor.style.display = '';
        jsonEditor.style.display = 'none';
        // Sync JSON -> fields: parse JSON and update field values
        const jsonArea = document.getElementById('debugBodyJson');
        if (jsonArea) {
            try {
                const obj = JSON.parse(jsonArea.value);
                document.querySelectorAll('#bodyFieldsTable tbody tr').forEach(tr => {
                    const fieldName = tr.dataset.field;
                    if (fieldName && obj.hasOwnProperty(fieldName)) {
                        const input = tr.querySelector('.body-field-val');
                        if (input) {
                            const v = obj[fieldName];
                            input.value = typeof v === 'object' ? JSON.stringify(v) : v;
                        }
                    }
                });
            } catch(e) {}
        }
    } else {
        fieldBtn.classList.remove('active');
        jsonBtn.classList.add('active');
        fieldEditor.style.display = 'none';
        jsonEditor.style.display = '';
        // Sync fields -> JSON: build JSON from field values
        const fieldsTable = document.getElementById('bodyFieldsTable');
        if (fieldsTable) {
            const obj = {};
            fieldsTable.querySelectorAll('tbody tr').forEach(tr => {
                const fieldName = tr.dataset.field;
                const fieldType = tr.dataset.type;
                const input = tr.querySelector('.body-field-val');
                if (fieldName && input) {
                    let val = input.value.trim();
                    if (val === '') {
                        obj[fieldName] = getDefaultValue(fieldType);
                    } else {
                        try { obj[fieldName] = JSON.parse(val); } catch(e) { obj[fieldName] = val; }
                    }
                }
            });
            const jsonArea = document.getElementById('debugBodyJson');
            if (jsonArea) jsonArea.value = JSON.stringify(obj, null, 2);
        }
    }
}

function getDebugBody() {
    // Try field editor first
    const fieldsTable = document.getElementById('bodyFieldsTable');
    if (fieldsTable && fieldsTable.offsetParent !== null) {
        const obj = {};
        fieldsTable.querySelectorAll('tbody tr').forEach(tr => {
            const fieldName = tr.dataset.field;
            const fieldType = tr.dataset.type;
            const input = tr.querySelector('.body-field-val');
            if (fieldName && input) {
                let val = input.value.trim();
                if (val === '') {
                    obj[fieldName] = getDefaultValue(fieldType);
                } else {
                    try { obj[fieldName] = JSON.parse(val); } catch(e) { obj[fieldName] = val; }
                }
            }
        });
        return JSON.stringify(obj, null, 2);
    }
    // Try JSON textarea
    const jsonArea = document.getElementById('debugBodyJson');
    if (jsonArea && jsonArea.offsetParent !== null) return jsonArea.value;
    // Fallback raw textarea
    const rawArea = document.getElementById('debugBody');
    return rawArea ? rawArea.value : '';
}

async function saveDebugState(responseBody) {
    if (!currentApi) return;
    const url = document.getElementById('debugUrl').value;
    const method = document.getElementById('debugMethod').value;
    const { pairs: headers, descs: headerDescs } = getDebugKvPairsWithDesc('headersTable');
    const { pairs: params, descs: paramDescs } = getDebugKvPairsWithDesc('paramsTable');
    const body = getDebugBody();

    // Init persistMeta if missing
    if (!currentApi.persistMeta) {
        currentApi.persistMeta = { userModified: true, modifiedFields: [], lastModified: new Date().toISOString(), version: 1 };
    }
    currentApi.persistMeta.userModified = true;
    currentApi.persistMeta.lastModified = new Date().toISOString();
    if (!currentApi.persistMeta.modifiedFields) currentApi.persistMeta.modifiedFields = [];
    const mf = currentApi.persistMeta.modifiedFields;

    // Update debug-specific fields
    currentApi.debugMethod = method;
    currentApi.debugUrl = url;
    currentApi.debugHeaders = headers;
    currentApi.debugParams = params;
    currentApi.debugHeaderDescs = headerDescs;
    currentApi.debugParamDescs = paramDescs;
    currentApi.debugBody = body;
    if (responseBody !== undefined) currentApi.debugResponse = responseBody;

    // Sync back to shared fields so doc mode also sees the edits
    // Mark each synced field as user-modified so mergeApi preserves them on re-scan
    // 1. Sync header descriptions to headerParams
    if (!currentApi.headerParams) currentApi.headerParams = [];
    Object.entries(headers).forEach(([k, v]) => {
        let existing = currentApi.headerParams.find(p => p.name === k);
        if (existing) {
            if (headerDescs[k]) { existing.description = headerDescs[k]; mf.push('headerParams.' + k + '.description'); }
        } else {
            currentApi.headerParams.push({ name: k, type: 'String', description: headerDescs[k] || '' });
            mf.push('headerParams.' + k + '.description');
        }
    });
    // 2. Sync param descriptions and values to queryParams
    if (!currentApi.queryParams) currentApi.queryParams = [];
    Object.entries(params).forEach(([k, v]) => {
        let existing = currentApi.queryParams.find(p => p.name === k);
        if (existing) {
            if (paramDescs[k]) { existing.description = paramDescs[k]; mf.push('queryParams.' + k + '.description'); }
            if (v) { existing.example = v; mf.push('queryParams.' + k + '.example'); }
        } else {
            currentApi.queryParams.push({ name: k, type: 'String', description: paramDescs[k] || '', example: v || '' });
            mf.push('queryParams.' + k + '.description');
        }
    });
    // 3. Sync request body example
    if (body && currentApi.requestBody) {
        currentApi.requestBody.example = body;
        if (!mf.includes('requestBody.example')) mf.push('requestBody.example');
    }

    // Deduplicate modifiedFields
    currentApi.persistMeta.modifiedFields = [...new Set(mf)];

    // Persist to backend
    try {
        const res = await fetch(API + '/endpoints/' + encodeURIComponent(currentApi.methodSignature), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentApi)
        });
        if (res.ok) {
            const saved = await res.json();
            // Update allApis entry so page refresh doesn't lose data
            const idx = allApis.findIndex(a => a.methodSignature === currentApi.methodSignature);
            if (idx >= 0) allApis[idx] = saved;
            currentApi = saved;
        }
    } catch (e) {
        console.error('Failed to save debug state', e);
    }
}

async function sendRequest() {
    const method = document.getElementById('debugMethod').value;
    const url = document.getElementById('debugUrl').value;
    const params = getKvPairs('paramsTable');
    const headers = getKvPairs('headersTable');
    const body = getDebugBody();

    document.getElementById('debugResponseBody').textContent = 'Loading...';
    document.getElementById('debugResponseHeader').style.display = 'none';
    document.getElementById('sseEvents').style.display = 'none';
    document.getElementById('sseEvents').innerHTML = '';

    try {
        const res = await fetch(API + '/debug', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ method, url, headers, queryParams: params, body: body || null })
        });
        const data = await res.json();
        showDebugResponse(data);
        // Auto-save debug state with response
        if (!data.error) {
            await saveDebugState(data.body || '');
        } else {
            await saveDebugState();
        }
    } catch (e) {
        document.getElementById('debugResponseBody').textContent = 'Error: ' + e.message;
        await saveDebugState();
    }
}

function showDebugResponse(data) {
    const header = document.getElementById('debugResponseHeader');
    const status = document.getElementById('debugStatus');
    const time = document.getElementById('debugTime');
    const body = document.getElementById('debugResponseBody');

    header.style.display = '';
    document.getElementById('sseEvents').style.display = 'none';

    if (data.error) {
        status.textContent = 'Error';
        status.className = 'status err';
        body.textContent = data.error;
    } else {
        status.textContent = data.statusCode;
        status.className = 'status ' + (data.statusCode >= 200 && data.statusCode < 400 ? 'ok' : 'err');
        time.textContent = data.elapsedMs + 'ms';
        try {
            body.innerHTML = syntaxHighlight(data.body || '');
        } catch (e) {
            body.textContent = data.body || '';
        }
        document.getElementById('updateExampleBtn').style.display = '';
    }
}

function connectSSE() {
    const url = document.getElementById('debugUrl').value;
    const headers = getKvPairs('headersTable');
    const headerStr = Object.entries(headers).map(([k,v]) => k + ':' + v).join(';');

    document.getElementById('debugResponseBody').style.display = 'none';
    document.getElementById('sseEvents').style.display = '';
    document.getElementById('sseEvents').innerHTML = '';
    document.getElementById('debugResponseHeader').style.display = '';

    const statusEl = document.getElementById('debugStatus');
    statusEl.textContent = 'Connected';
    statusEl.className = 'status ok';

    const eventsEl = document.getElementById('sseEvents');
    const sseUrl = API + '/debug/sse?url=' + encodeURIComponent(url) + (headerStr ? '&headers=' + encodeURIComponent(headerStr) : '');

    if (sseSource) sseSource.close();
    sseSource = new EventSource(sseUrl);
    sseSource.onmessage = (e) => {
        const div = document.createElement('div');
        div.className = 'sse-event';
        div.textContent = e.data;
        eventsEl.appendChild(div);
        eventsEl.scrollTop = eventsEl.scrollHeight;
    };
    sseSource.onerror = () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'status err';
        sseSource.close();
    };
}

async function updateExample() {
    if (!currentApi) return;
    const body = document.getElementById('debugResponseBody').textContent;
    try {
        const res = await fetch(API + '/endpoints/' + encodeURIComponent(currentApi.methodSignature) + '/update-example', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: body
        });
        if (res.ok) {
            currentApi = await res.json();
            showToast('Example updated');
        }
    } catch (e) { showToast('Failed: ' + e.message); }
}

// ==================== Edit ====================
function openEditApi() {
    if (!currentApi) return;
    const modal = document.getElementById('editModal');
    const body = document.getElementById('editModalBody');
    document.getElementById('editModalTitle').textContent = 'Edit API: ' + currentApi.name;

    let html = '';
    html += formField('Name', 'editName', currentApi.name || '');
    html += formField('Description', 'editDesc', currentApi.description || '', 'textarea');
    html += formField('Path', 'editPath', currentApi.path || '');
    html += formSelect('HTTP Method', 'editMethod', ['GET','POST','PUT','DELETE','PATCH'], currentApi.httpMethod);

    // Response example
    html += formField('Response Example', 'editRespExample', currentApi.response?.example || '', 'textarea');

    // Request body example
    html += formField('Request Body Example', 'editReqExample', currentApi.requestBody?.example || '', 'textarea');

    // Tags
    html += formField('Tags (comma separated)', 'editTags', (currentApi.tags || []).join(', '));

    body.innerHTML = html;
    document.getElementById('editModalSave').onclick = saveEditApi;
    modal.classList.add('open');
}

function openEditEntity() {
    if (!currentEntity) return;
    const modal = document.getElementById('editModal');
    const body = document.getElementById('editModalBody');
    document.getElementById('editModalTitle').textContent = 'Edit Entity: ' + currentEntity.name;

    let html = '';
    html += formField('Description', 'editEntDesc', currentEntity.description || '', 'textarea');

    // Fields
    if (currentEntity.fields && currentEntity.fields.length) {
        html += '<div class="form-group"><label>Fields</label>';
        html += '<table class="kv-table"><thead><tr><th>Name</th><th>Description</th><th>Example</th></tr></thead><tbody id="entityFieldsBody">';
        currentEntity.fields.forEach((f, i) => {
            html += `<tr data-idx="${i}"><td><input value="${esc(f.name)}" disabled style="opacity:.6"></td><td><input value="${esc(f.description || '')}" class="ef-desc"></td><td><input value="${esc(f.example || '')}" class="ef-example"></td></tr>`;
        });
        html += '</tbody></table></div>';
    }

    body.innerHTML = html;
    document.getElementById('editModalSave').onclick = saveEditEntity;
    modal.classList.add('open');
}

async function saveEditApi() {
    if (!currentApi) return;
    currentApi.name = document.getElementById('editName').value;
    currentApi.description = document.getElementById('editDesc').value;
    currentApi.path = document.getElementById('editPath').value;
    currentApi.httpMethod = document.getElementById('editMethod').value;
    currentApi.tags = document.getElementById('editTags').value.split(',').map(s => s.trim()).filter(Boolean);

    const respExample = document.getElementById('editRespExample').value;
    if (currentApi.response) currentApi.response.example = respExample;

    const reqExample = document.getElementById('editReqExample').value;
    if (currentApi.requestBody) currentApi.requestBody.example = reqExample;

    try {
        const res = await fetch(API + '/endpoints/' + encodeURIComponent(currentApi.methodSignature), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentApi)
        });
        if (res.ok) {
            currentApi = await res.json();
            closeEditModal();
            renderContent();
            showToast('API updated');
            await loadAllApis();
            await loadTree();
        }
    } catch (e) { showToast('Failed: ' + e.message); }
}

async function saveEditEntity() {
    if (!currentEntity) return;
    currentEntity.description = document.getElementById('editEntDesc').value;

    // Update fields
    document.querySelectorAll('#entityFieldsBody tr').forEach(tr => {
        const idx = parseInt(tr.dataset.idx);
        if (currentEntity.fields[idx]) {
            currentEntity.fields[idx].description = tr.querySelector('.ef-desc').value;
            currentEntity.fields[idx].example = tr.querySelector('.ef-example').value;
        }
    });

    try {
        const res = await fetch(API + '/entities/' + encodeURIComponent(currentEntity.fullName), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentEntity)
        });
        if (res.ok) {
            currentEntity = await res.json();
            closeEditModal();
            renderContent();
            showToast('Entity updated');
            await loadAllEntities();
        }
    } catch (e) { showToast('Failed: ' + e.message); }
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
}

function formField(label, id, value, type) {
    if (type === 'textarea') {
        return `<div class="form-group"><label>${esc(label)}</label><textarea id="${id}" rows="4">${esc(value)}</textarea></div>`;
    }
    return `<div class="form-group"><label>${esc(label)}</label><input id="${id}" value="${esc(value)}"></div>`;
}

function formSelect(label, id, options, selected) {
    let html = `<div class="form-group"><label>${esc(label)}</label><select id="${id}">`;
    options.forEach(o => html += `<option ${o===selected?'selected':''}>${o}</option>`);
    html += '</select></div>';
    return html;
}

// ==================== Actions ====================
async function rescan() {
    showToast('Rescanning...');
    try {
        const res = await fetch(API + '/rescan', { method: 'POST' });
        if (res.ok) {
            const result = await res.json();
            showToast(`Scan complete: ${result.controllers} controllers, ${result.newApis} new APIs (${result.elapsedMs}ms)`);
            await loadTree();
            await loadAllApis();
            await loadAllEntities();
        }
    } catch (e) { showToast('Failed: ' + e.message); }
}

async function loadEntities() {
    await loadAllEntities();
    if (allEntities.length === 0) {
        showToast('No entities found');
        return;
    }
    // Show first entity
    selectEntity(allEntities[0].fullName);
}

// ==================== Utils ====================
function esc(s) {
    if (!s) return '';
    const el = document.createElement('span');
    el.textContent = s;
    return el.innerHTML;
}

function syntaxHighlight(json) {
    if (!json) return '';
    json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
        let cls = 'color:#059669'; // number
        if (/^"/.test(match)) {
            if (/:$/.test(match)) cls = 'color:#2563eb'; // key
            else cls = 'color:#b45309'; // string
        } else if (/true|false/.test(match)) cls = 'color:#dc2626'; // boolean
        else if (/null/.test(match)) cls = 'color:#6b7280'; // null
        return '<span style="' + cls + '">' + match + '</span>';
    });
}

function copyCode(btn) {
    const code = btn.parentElement.textContent.replace('Copy', '').trim();
    navigator.clipboard.writeText(code);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

function toggleTheme() {
    const html = document.documentElement;
    const nextTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', nextTheme);
    localStorage.setItem('marginalia-theme', nextTheme);
    updateThemeToggle();
}

function initTheme() {
    const savedTheme = localStorage.getItem('marginalia-theme');
    document.documentElement.setAttribute('data-theme', savedTheme || 'dark');
    updateThemeToggle();
}

function updateThemeToggle() {
    const btn = document.getElementById('themeToggle');
    if (!btn) return;
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.textContent = dark ? '☀' : '◐';
    btn.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
}

// Click outside modal to close
document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeEditModal();
});

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeEditModal();
    if (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
    }
});

// Init
initTheme();
init();
</script>
